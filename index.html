<!DOCTYPE html>
<!--
  Showwork — the board.

  THE WHOLE PAGE IN FOUR STEPS:
    1. You write on the canvas. Pen and mouse draw; fingers pan, never draw.
    2. "Check my work" sends a picture of the board to our own server.
    3. The server reads it back to you. YOU fix the reading if it got it wrong.
    4. Only then does it mark the FIRST mistake — written onto the board,
       stroke by stroke, in its own reserved colour.

  Step 3 is the point of the whole thing. A tutor that confidently misreads
  your work and corrects you for a mistake you never made is worse than no
  tutor at all. So it never tutors on a reading you haven't confirmed.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Showwork</title>
<style>
  /* ============================================================
     THE PALETTE — muted, paper-like. The AI's amber is reserved:
     it is never offered in the student's pen colours, so its marks
     can never be mistaken for theirs.
     ============================================================ */
  :root {
    --paper:   #fbfaf7;
    --line:    #e7e3da;
    --ui:      #ffffff;
    --edge:    #d9d4c9;
    --text:    #2e2c28;
    --muted:   #7a746a;
    --ai-ink:  #c2410c;   /* RESERVED. Never a student colour. */
    --accent:  #3f5d52;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--paper); color: var(--text);
    font: 15px/1.5 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
    /* fingers must never scroll the page — the canvas handles them */
    overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none;
  }

  /* ---- the board fills everything; the UI floats over it ---- */
  #board { position: fixed; inset: 0; display: block; cursor: crosshair; touch-action: none;
           -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }

  /* ============================================================
     THE TOOLBAR — one row, no modes to learn. Pick up a pen, write.
     ============================================================ */
  #bar {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 14px;
    padding: 9px 14px; border-radius: 12px;
    background: var(--ui); border: 1px solid var(--edge);
    box-shadow: 0 2px 14px rgba(0,0,0,.07);
    z-index: 10; max-width: calc(100vw - 24px);
  }

  .pens { display: flex; gap: 7px; }
  .pen {
    width: 26px; height: 26px; border-radius: 50%;
    border: 2px solid transparent; cursor: pointer; padding: 0;
  }
  .pen[aria-pressed="true"] { border-color: var(--accent); transform: scale(1.12); }

  .sep { width: 1px; height: 24px; background: var(--edge); }

  /* the eraser is a toggle: pressed = every pen or mouse stroke erases */
  button.act[aria-pressed="true"] { background: #ebe6da; border-color: var(--accent); }
  #board.erasing { cursor: cell; }

  button.act {
    border: 1px solid var(--edge); background: var(--ui); color: var(--text);
    border-radius: 8px; padding: 7px 13px; cursor: pointer; font-size: 14px;
    font-family: inherit;
  }
  button.act:hover:not(:disabled) { background: #f4f1ea; }
  button.act:disabled { opacity: .45; cursor: not-allowed; }
  button.primary {
    background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600;
  }
  button.primary:hover:not(:disabled) { background: #354f45; }

  /* ============================================================
     THE READ-BACK PANEL — "here is what I read."
     The student owns this text. They can fix any of it.
     ============================================================ */
  #panel {
    position: fixed; right: 16px; top: 76px; width: min(390px, calc(100vw - 32px));
    max-height: calc(100vh - 100px); overflow: auto;
    background: var(--ui); border: 1px solid var(--edge); border-radius: 12px;
    box-shadow: 0 4px 22px rgba(0,0,0,.09); padding: 16px; z-index: 10;
    display: none;
  }
  #panel.on { display: block; }
  #panel h2 { margin: 0 0 4px; font-size: 15px; }
  #panel .why { margin: 0 0 11px; font-size: 13px; color: var(--muted); }
  #read {
    width: 100%; min-height: 190px; resize: vertical;
    font: 13px/1.6 ui-monospace, "SF Mono", Menlo, monospace;
    color: var(--text); background: var(--paper);
    border: 1px solid var(--edge); border-radius: 8px; padding: 10px;
    -webkit-user-select: text; user-select: text;
  }
  #panel .row { display: flex; gap: 8px; margin-top: 11px; }
  #panel .row button { flex: 1; }

  /* the topic line: tells the model what the problem IS, so it isn't reading blind */
  #topic {
    position: fixed; top: 64px; left: 50%; transform: translateX(-50%);
    width: min(480px, calc(100vw - 32px)); z-index: 9;
    padding: 7px 12px; border-radius: 9px; font: inherit; font-size: 13.5px;
    color: var(--text); background: var(--ui); border: 1px solid var(--edge);
    -webkit-user-select: text; user-select: text;
  }
  #topic::placeholder { color: var(--muted); }

  #status {
    position: fixed; left: 16px; bottom: 14px; z-index: 10;
    font-size: 13px; color: var(--muted); max-width: 60vw;
  }
  #status.bad { color: #a33; }
  #showRead { position: fixed; right: 16px; bottom: 12px; z-index: 10; font-size: 12.5px; padding: 5px 10px; }

  #hint {
    position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
    z-index: 5; font-size: 12.5px; color: var(--muted); pointer-events: none;
  }
</style>
</head>
<body>

<canvas id="board"></canvas>

<div id="bar">
  <div class="pens" id="pens"></div>
  <button class="act" id="eraser" aria-pressed="false" title="Eraser — touch a stroke to remove it">Eraser</button>
  <div class="sep"></div>
  <button class="act" id="undo" title="Undo">Undo</button>
  <button class="act" id="clear" title="Clear the ink (keeps the PDF)">Clear</button>
  <div class="sep"></div>
  <button class="act" id="pdfbtn" title="Put a PDF on the board to write on">PDF</button>
  <input type="file" id="pdffile" accept="application/pdf" hidden>
  <div class="sep"></div>
  <button class="act primary" id="check">Check my work</button>
</div>

<input id="topic" placeholder="What are you working on? e.g. M220 — tangent lines with the power rule" autocomplete="off" spellcheck="false">

<div id="panel">
  <h2 id="panelTitle">Here's what I read</h2>
  <p class="why" id="panelWhy"></p>
  <textarea id="read" spellcheck="false"></textarea>
  <div class="row">
    <button class="act" id="cancel">Cancel</button>
    <button class="act primary" id="confirm">Check it</button>
  </div>
</div>

<div id="status"></div>
<button class="act" id="showRead" hidden title="See or fix what was read from your handwriting">What I read ▸</button>
<div id="hint">Pen or mouse draws · Eraser removes a stroke · two fingers pan and zoom</div>

<script>
/* ============================================================
   THE STATE — everything the board knows.

   strokes[] is the memory. Undo pops it, clear empties it, and
   every redraw is just "walk the list and draw it again". The
   AI's writing lives in its OWN list so it can never be undone
   by the student's undo, and never blends into their work.
   ============================================================ */
const PENS   = ['#2e2c28', '#1d4ed8', '#166534', '#7c2d12'];  /* no amber here */
const AI_INK = '#c2410c';                                      /* reserved */

const strokes = [];      /* [{color, width, pts:[{x,y}]}]  — the student's */
const pages   = [];      /* [{img, x, y, w, h}] — a PDF's pages, stacked, UNDER the ink */
const aiMarks = [];      /* [{x, y, size, text, shown}]    — the AI's writing */
const aiLines = [];      /* [{x1,y1,x2,y2, shown}]         — the AI's strike-throughs */

let pen = PENS[0];
let tool = 'pen';        /* 'pen' or 'eraser' */
let drawing = null;      /* the stroke in progress */
let erasing = null;      /* strokes removed during ONE eraser drag, for undo */

/* history[] is what undo walks. Every action is either
     {type:'add',   stroke}          — a stroke was drawn
     {type:'erase', strokes:[...]}   — one eraser drag removed these
   so undo can put back exactly what one gesture took away. */
const history = [];
let pan = {x: 0, y: 0};  /* how far the board has been dragged */
let zoom = 1;            /* 1 = life size; pinch or trackpad changes it */
let panFrom = null;      /* where a finger-drag started */
const touches = new Map();  /* live fingers, id -> {x,y}; two of them = a pinch */
let pinch = null;           /* {dist, mid, zoom0, pan0} while two fingers are down */

const cv  = document.getElementById('board');
const ctx = cv.getContext('2d');
const PAPER = getCSS('--paper'), RULE = getCSS('--line');   /* read once, not per frame */

/* ============================================================
   fit — size the canvas to the window at real device resolution.
   Without the devicePixelRatio scaling, handwriting looks furry
   on a retina screen, and the vision model has to read furry ink.
   ============================================================ */
function fit() {
  const r = window.devicePixelRatio || 1;
  cv.width  = Math.floor(innerWidth  * r);
  cv.height = Math.floor(innerHeight * r);
  cv.style.width  = innerWidth  + 'px';
  cv.style.height = innerHeight + 'px';
  ctx.setTransform(r, 0, 0, r, 0, 0);
  redraw();
}
addEventListener('resize', fit);

/* ============================================================
   redraw — the whole board, from the lists, every time.

   Simple beats clever here: there is no partial repainting to get
   wrong, and at handwriting scale it is far faster than it needs
   to be.
   ============================================================ */
function redraw() {
  const r = window.devicePixelRatio || 1;
  ctx.setTransform(r, 0, 0, r, 0, 0);
  ctx.clearRect(0, 0, innerWidth, innerHeight);

  /* ---- the ruled paper, so it reads as a place to write ---- */
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, innerWidth, innerHeight);
  ctx.strokeStyle = RULE;
  ctx.lineWidth = 1;
  const GAP = 38;
  for (let y = (pan.y % GAP + GAP) % GAP; y < innerHeight; y += GAP) {
    ctx.beginPath(); ctx.moveTo(0, y + .5); ctx.lineTo(innerWidth, y + .5); ctx.stroke();
  }

  /* ---- everything below this moves with the pan and scales with the zoom ---- */
  ctx.save();
  ctx.translate(pan.x, pan.y);
  ctx.scale(zoom, zoom);

  /* the paper you brought: PDF pages, drawn first so ink sits on top */
  for (const pg of pages) {
    ctx.shadowColor = 'rgba(0,0,0,.12)'; ctx.shadowBlur = 12; ctx.shadowOffsetY = 3;
    ctx.fillStyle = '#fff'; ctx.fillRect(pg.x, pg.y, pg.w, pg.h);
    ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
    ctx.drawImage(pg.img, pg.x, pg.y, pg.w, pg.h);
  }

  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  for (const s of strokes) drawStroke(s);
  if (drawing) drawStroke(drawing);

  /* ---- the AI's ink: its own colour, its own layer, and only ---- */
  /* ---- as many characters as the animation has revealed      ---- */
  /* its strike-throughs: a line through the wrong bit, drawn left to right */
  ctx.strokeStyle = AI_INK; ctx.lineWidth = 3; ctx.lineCap = 'round';
  for (const l of aiLines) {
    ctx.beginPath();
    ctx.moveTo(l.x1, l.y1);
    ctx.lineTo(l.x1 + (l.x2 - l.x1) * l.shown, l.y1 + (l.y2 - l.y1) * l.shown);
    ctx.stroke();
  }

  ctx.fillStyle = AI_INK;
  ctx.textBaseline = 'top';
  for (const m of aiMarks) {
    ctx.font = aiFont(m.size);
    const lines = m.text.slice(0, m.shown).split('\n');
    lines.forEach((ln, i) => ctx.fillText(ln, m.x, m.y + i * m.size * 1.35));
  }

  ctx.restore();
}

function drawStroke(s) {
  ctx.strokeStyle = s.color;
  ctx.lineWidth = s.width;
  ctx.beginPath();
  tracePath(ctx, s.pts);
  ctx.stroke();
}

/* ============================================================
   tracePath — the shape of a stroke, shared by the screen and the
   snapshot so they can never disagree. Straight lines between pen
   samples look like a polygon; a curve through each midpoint, bent
   toward the sample, reads as ink. One point = a dot (round caps).
   ============================================================ */
function tracePath(c, pts) {
  if (!pts.length) return;
  c.moveTo(pts[0].x, pts[0].y);
  if (pts.length < 3) { for (const q of pts) c.lineTo(q.x, q.y); return; }
  for (let i = 1; i < pts.length - 1; i++) {
    const mx = (pts[i].x + pts[i + 1].x) / 2, my = (pts[i].y + pts[i + 1].y) / 2;
    c.quadraticCurveTo(pts[i].x, pts[i].y, mx, my);
  }
  const l = pts[pts.length - 1];
  c.lineTo(l.x, l.y);
}

function getCSS(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

/* ============================================================
   INPUT — the rule that makes this feel like paper:

     pen or mouse  -> draw
     finger        -> pan, never draw

   That is real palm rejection. You can rest your hand on the
   screen while you write, the way you do on paper.
   ============================================================ */
let lastPenAt = 0;       /* when the pen last touched — a palm lands right after */
const PALM_MS = 1500;    /* a finger inside this window of pen contact is a palm */
let penSeen = false;     /* once a real pen has touched, single fingers are palms, full stop */

cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId);

  if (e.pointerType === 'touch') {
    /* A finger while the pen is down, or right after it lifted, is your
       palm — not a request to move the paper. Ignore it completely.
       Without this the board slid under the pen mid-word. */
    if (drawing || erasing || performance.now() - lastPenAt < PALM_MS) return;

    touches.set(e.pointerId, {x: e.clientX, y: e.clientY});
    /* Once a pen has been used this session, one finger is a palm — it
       never pans. Two fingers still pan and zoom (the pinch tracks its
       midpoint, so moving both fingers moves the paper). This is how
       GoodNotes and Procreate behave, and it is what makes resting
       your hand on the glass safe. */
    if (penSeen && touches.size === 1) return;
    if (touches.size === 2) {                /* second finger: a pinch begins */
      const [a, b] = [...touches.values()];
      pinch = {dist: Math.hypot(a.x - b.x, a.y - b.y),
               mid: {x: (a.x + b.x) / 2, y: (a.y + b.y) / 2},
               zoom0: zoom, pan0: {...pan}};
      panFrom = null;
    } else if (touches.size === 1) {         /* one finger: move the paper */
      panFrom = {x: e.clientX - pan.x, y: e.clientY - pan.y};
    }
    return;
  }

  lastPenAt = performance.now();
  if (e.pointerType === 'pen') penSeen = true;
  panFrom = null; pinch = null; touches.clear();   /* pen wins over fingers */

  /* eraser: the toolbar toggle, OR the eraser end of a pen that has one
     (button 5 / buttons bit 32 — Surface, Wacom). Apple Pencil has neither,
     which is why the toggle exists. */
  if (tool === 'eraser' || e.button === 5 || (e.buttons & 32)) {
    erasing = [];
    eraseAt(pt(e));
    return;
  }

  /* pen pressure gives a live line width; a mouse reports 0, so fall back */
  drawing = {color: pen, width: penWidth(e), pts: [pt(e)]};
});

cv.addEventListener('pointermove', e => {
  if (e.pointerType === 'touch') {
    if (!touches.has(e.pointerId)) return;   /* a palm we chose to ignore */
    touches.set(e.pointerId, {x: e.clientX, y: e.clientY});

    if (pinch && touches.size === 2) {
      /* zoom by how much the fingers spread; keep the board point that
         was under the fingers' midpoint pinned under it as they move */
      const [a, b] = [...touches.values()];
      const dist = Math.hypot(a.x - b.x, a.y - b.y);
      const mid  = {x: (a.x + b.x) / 2, y: (a.y + b.y) / 2};
      zoom = Math.min(6, Math.max(0.25, pinch.zoom0 * dist / pinch.dist));
      const bx = (pinch.mid.x - pinch.pan0.x) / pinch.zoom0;   /* board point under mid0 */
      const by = (pinch.mid.y - pinch.pan0.y) / pinch.zoom0;
      pan = {x: mid.x - bx * zoom, y: mid.y - by * zoom};
      return redraw();
    }
    if (panFrom) {
      pan = {x: e.clientX - panFrom.x, y: e.clientY - panFrom.y};
      return redraw();
    }
    return;
  }

  lastPenAt = performance.now();
  if (erasing) return eraseAt(pt(e));
  if (!drawing) return;

  /* The Pencil samples far faster than the browser fires events; the
     in-between samples are handed over as "coalesced" events. Use them,
     or fast strokes come out as a few long straight lines. */
  /* (the list can come back EMPTY for synthetic or non-pen input — then
     the event itself is the only sample, and must not be dropped) */
  const coalesced = e.getCoalescedEvents ? e.getCoalescedEvents() : null;
  const events = coalesced && coalesced.length ? coalesced : [e];
  const from = drawing.pts.length;
  for (const ce of events) drawing.pts.push(pt(ce));

  /* Draw only the new bit of THIS stroke, not the whole board again.
     A full redraw per sample is what made ink trail behind the pen. */
  ctx.save();
  ctx.translate(pan.x, pan.y);
  ctx.scale(zoom, zoom);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = drawing.color; ctx.lineWidth = drawing.width;
  ctx.beginPath();
  tracePath(ctx, drawing.pts.slice(Math.max(0, from - 2)));
  ctx.stroke();
  ctx.restore();
});

function done(e) {
  if (e.pointerType === 'touch') {
    touches.delete(e.pointerId);
    if (touches.size < 2) pinch = null;
    if (touches.size === 0) panFrom = null;
    else if (touches.size === 1) {           /* one finger left: it can keep panning */
      const t = [...touches.values()][0];
      panFrom = {x: t.x - pan.x, y: t.y - pan.y};
    }
    return;
  }
  if (erasing) {                                   /* one drag = one undo step */
    if (erasing.length) history.push({type: 'erase', strokes: erasing});
    erasing = null;
    return redraw();
  }
  if (drawing) {
    if (drawing.pts.length === 1) drawing.pts.push({...drawing.pts[0]});   /* a tap = a dot */
    strokes.push(drawing);
    history.push({type: 'add', stroke: drawing});
    lastPenAt = performance.now();
  }
  drawing = null;
  redraw();
}

/* ============================================================
   eraseAt — a stroke eraser, like OneNote's default: touch any
   part of a stroke and the whole stroke goes. Whole strokes, not
   pixels, because strokes[] is the memory — a pixel eraser would
   leave the picture and the list disagreeing.
   ============================================================ */
const ERASER_R = 12;
function eraseAt(p) {
  let hit = false;
  for (let i = strokes.length - 1; i >= 0; i--) {
    if (strokeNear(strokes[i], p, ERASER_R / zoom)) {
      erasing.push(strokes.splice(i, 1)[0]);
      hit = true;
    }
  }
  if (hit) redraw();
}

/* is point p within r of any segment of stroke s? */
function strokeNear(s, p, r) {
  const pts = s.pts;
  for (let i = 1; i < pts.length; i++) {
    if (segDist(pts[i - 1], pts[i], p) <= r + s.width / 2) return true;
  }
  return false;
}

/* distance from point p to the segment a-b */
function segDist(a, b, p) {
  const dx = b.x - a.x, dy = b.y - a.y;
  const len2 = dx * dx + dy * dy || 1;
  let t = ((p.x - a.x) * dx + (p.y - a.y) * dy) / len2;
  t = Math.max(0, Math.min(1, t));
  const qx = a.x + t * dx, qy = a.y + t * dy;
  return Math.hypot(p.x - qx, p.y - qy);
}
cv.addEventListener('pointerup', done);
cv.addEventListener('pointercancel', done);
/* NOT pointerleave: with pointer capture the up still arrives, and ending
   a stroke the moment the pen crossed the edge cut words in half. */

/* a mouse can't pan by dragging (dragging draws), so the wheel / trackpad
   does. A trackpad pinch arrives as a wheel with ctrlKey — that zooms. */
cv.addEventListener('wheel', e => {
  e.preventDefault();
  if (e.ctrlKey || e.metaKey) {
    const factor = Math.exp(-e.deltaY * 0.01);
    zoomAt(e.clientX, e.clientY, Math.min(6, Math.max(0.25, zoom * factor)));
  } else {
    pan = {x: pan.x - e.deltaX, y: pan.y - e.deltaY};
  }
  redraw();
}, {passive: false});

/* change zoom while keeping the board point under (sx, sy) where it is */
function zoomAt(sx, sy, z) {
  const bx = (sx - pan.x) / zoom, by = (sy - pan.y) / zoom;
  zoom = z;
  pan = {x: sx - bx * zoom, y: sy - by * zoom};
}

/* the point, in board space — pan and zoom undone, so ink lands where the pen is */
const pt = e => ({x: (e.clientX - pan.x) / zoom, y: (e.clientY - pan.y) / zoom});
const penWidth = e => (e.pressure > 0 && e.pointerType === 'pen')
  ? 1.2 + e.pressure * 3.4 : 2.4;

/* ============================================================
   THE TOOLBAR
   ============================================================ */
const pensEl = document.getElementById('pens');
PENS.forEach((c, i) => {
  const b = document.createElement('button');
  b.className = 'pen';
  b.style.background = c;
  b.setAttribute('aria-pressed', i === 0);
  b.setAttribute('aria-label', 'Pen colour ' + (i + 1));
  b.onclick = () => {
    pen = c;
    setTool('pen');
    [...pensEl.children].forEach(x => x.setAttribute('aria-pressed', x === b));
  };
  pensEl.appendChild(b);
});

const eraserBtn = document.getElementById('eraser');
eraserBtn.onclick = () => setTool(tool === 'eraser' ? 'pen' : 'eraser');
function setTool(t) {
  tool = t;
  eraserBtn.setAttribute('aria-pressed', t === 'eraser');
  cv.classList.toggle('erasing', t === 'eraser');
}

/* undo reverses the LAST ACTION — a drawn stroke, or everything one
   eraser drag removed — so erasing is never a one-way door */
document.getElementById('undo').onclick = () => {
  const last = history.pop();
  if (!last) return;
  if (last.type === 'add') {
    const i = strokes.indexOf(last.stroke);
    if (i >= 0) strokes.splice(i, 1);
  } else {
    strokes.push(...last.strokes);
  }
  redraw();
};
document.getElementById('clear').onclick = () => {
  strokes.length = 0; aiMarks.length = 0; aiLines.length = 0; history.length = 0; redraw(); say('');
  showRead.hidden = true;
};

/* ============================================================
   SNAPSHOT — a clean picture of the work for the model.

   Deliberately NOT the visible canvas: the ruled lines and the
   AI's own previous marks would both end up in the image, and the
   model would try to read them as part of the student's work.
   White paper, student ink only.
   ============================================================ */
function snapshot() {
  let box = bounds();
  if (!box) return null;

  /* If the ink is on a PDF page, send the whole page: the printed problem
     is context the model badly needs. Pages the ink never touched stay out. */
  const onPages = pages.filter(pg => pg.x < box.maxX && pg.x + pg.w > box.minX &&
                                     pg.y < box.maxY && pg.y + pg.h > box.minY);
  for (const pg of onPages) {
    box = {minX: Math.min(box.minX, pg.x), minY: Math.min(box.minY, pg.y),
           maxX: Math.max(box.maxX, pg.x + pg.w), maxY: Math.max(box.maxY, pg.y + pg.h)};
  }

  const PAD = 40, SCALE = onPages.length ? 1.3 : 2;   /* a page is already big; ink alone gets 2x */
  const w = box.maxX - box.minX + PAD * 2;
  const h = box.maxY - box.minY + PAD * 2;

  const off = document.createElement('canvas');
  off.width = w * SCALE; off.height = h * SCALE;
  const o = off.getContext('2d');
  o.fillStyle = '#ffffff';
  o.fillRect(0, 0, off.width, off.height);
  o.scale(SCALE, SCALE);
  o.translate(PAD - box.minX, PAD - box.minY);
  for (const pg of onPages) o.drawImage(pg.img, pg.x, pg.y, pg.w, pg.h);
  o.lineCap = 'round'; o.lineJoin = 'round';

  for (const s of strokes) {
    o.strokeStyle = s.color; o.lineWidth = s.width;
    o.beginPath(); tracePath(o, s.pts); o.stroke();
  }
  /* JPEG, not PNG: a fifth of the bytes to upload, and black ink on white
     paper survives compression fine. That upload was most of the wait. */
  return {url: off.toDataURL('image/jpeg', 0.85), box, PAD, SCALE, w: off.width, h: off.height};
}

function bounds() {
  if (!strokes.length) return null;
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const s of strokes) for (const p of s.pts) {
    if (p.x < minX) minX = p.x;  if (p.x > maxX) maxX = p.x;
    if (p.y < minY) minY = p.y;  if (p.y > maxY) maxY = p.y;
  }
  return {minX, minY, maxX, maxY};
}

/* ============================================================
   THE LOOP — check -> read back -> confirm -> first mistake
   ============================================================ */
const panel   = document.getElementById('panel');
const readEl  = document.getElementById('read');
const checkEl = document.getElementById('check');
let shot = null;                       /* the picture both calls share */

/* the topic is a per-device convenience: remember it, but never depend on it */
const topicEl = document.getElementById('topic');
try { topicEl.value = localStorage.getItem('showwork.topic') || ''; } catch {}
topicEl.addEventListener('input', () => { try { localStorage.setItem('showwork.topic', topicEl.value); } catch {} });
const topic = () => topicEl.value.trim();

const showRead = document.getElementById('showRead');
const panelTitle = document.getElementById('panelTitle');
const panelWhy = document.getElementById('panelWhy');

checkEl.onclick = async () => {
  shot = snapshot();
  if (!shot) return say('Write something first.', true);

  busy(true, 'Reading your work…');
  try {
    const r = await post('/transcribe', {image: shot.url, context: topic()});
    readEl.value = r.transcription;
    showRead.hidden = false;

    /* The model marks anything it wasn't sure of in [brackets]. If there
       are none, don't stop to ask — go straight to the check. If there
       are, ask ONLY about those, because tutoring on a misread is worse
       than no tutoring. The reading stays one tap away either way. */
    const doubts = (r.transcription.match(/\[[^\]]*\]/g) || []).length;
    if (doubts === 0) return runCheck();

    panelTitle.textContent = doubts === 1 ? "One spot I wasn't sure about" : `${doubts} spots I wasn't sure about`;
    panelWhy.textContent = "My other guess is in [brackets]. Keep the right one, then check.";
    panel.classList.add('on');
    readEl.focus();
  } catch (e) { say(e.message, true); }
  busy(false);
};

/* "What I read" — see or fix the reading any time, and re-check with it */
showRead.onclick = () => {
  panelTitle.textContent = "Here's what I read";
  panelWhy.textContent = "Fix anything I got wrong, then check again.";
  panel.classList.add('on');
};
document.getElementById('cancel').onclick = () => panel.classList.remove('on');
document.getElementById('confirm').onclick = () => runCheck();

async function runCheck() {
  panel.classList.remove('on');
  busy(true, 'Looking for the first thing to fix…');
  try {
    const v = await post('/check', {image: shot.url, work: readEl.value, context: topic()});
    if (v.all_correct) {
      write("Nothing wrong here.\nThis is all correct.");
    } else {
      /* cross out the wrong bit where it sits, then write the way through
         underneath: what's wrong, the steps, and the line done right */
      if (Array.isArray(v.wrong_box) && v.wrong_box.length === 4) strike(v.wrong_box);
      const steps = Array.isArray(v.steps) ? v.steps.filter(Boolean).slice(0, 3) : [];
      write([v.problem, "Here's how we do it:", ...steps,
             v.corrected_line ? `So: ${v.corrected_line}` : ''].filter(Boolean).join('\n'));
    }
    say(v.all_correct ? 'All correct.' : (v.checks_left != null ? `${v.checks_left} checks left` : ''));
  } catch (e) { say(e.message, true); }
  busy(false);
}

async function post(path, body) {
  const res = await fetch(path, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({message: 'no answer from server'}));
  if (!res.ok) throw new Error(data.message || 'something went wrong');
  return data;
}

/* ============================================================
   write — the AI's answer, appearing on the board the way a
   person writes it: one character at a time, below your work,
   in ink that is only ever its own.
   ============================================================ */
const aiFont = size => `${size}px "Bradley Hand", "Segoe Script", "Comic Sans MS", cursive`;

/* ============================================================
   strike — cross out the wrong characters where they sit on the board.
   The model saw the SNAPSHOT, so its box is in snapshot pixels (as
   thousandths). Undo the snapshot's scale and padding to land back on
   the board — the same numbers snapshot() used going the other way.
   ============================================================ */
function strike([ymin, xmin, ymax, xmax]) {
  if (!shot) return;
  const toBoard = (nx, ny) => ({
    x: (nx / 1000 * shot.w) / shot.SCALE - shot.PAD + shot.box.minX,
    y: (ny / 1000 * shot.h) / shot.SCALE - shot.PAD + shot.box.minY,
  });
  const midY = (ymin + ymax) / 2;
  const a = toBoard(xmin, midY), b = toBoard(xmax, midY);
  const line = {x1: a.x - 6, y1: a.y + 3, x2: b.x + 6, y2: b.y - 3, shown: 0};   /* a slight tilt reads as a hand */
  aiLines.push(line);
  const step = () => {
    line.shown = Math.min(1, line.shown + 0.07);
    redraw();
    if (line.shown < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

/* ============================================================
   handSize — how big the student writes, so the AI writes the same
   size. The median height of their strokes is close to their letter
   height (dashes and equals signs are too flat to count, so strokes
   under 6px are ignored). Clamped so it never gets silly.
   ============================================================ */
function handSize() {
  const hs = strokes.map(s => {
    let lo = Infinity, hi = -Infinity;
    for (const q of s.pts) { if (q.y < lo) lo = q.y; if (q.y > hi) hi = q.y; }
    return hi - lo;
  }).filter(h => h > 6).sort((a, b) => a - b);
  if (!hs.length) return 19;
  return Math.max(14, Math.min(72, hs[hs.length >> 1] * 0.95));
}

function write(text) {
  const box = bounds();
  const size = handSize();
  const width = Math.max(320, box ? box.maxX - box.minX : 0);   /* wrap to the work's width */
  const mark = {
    x: box ? box.minX : 60,
    y: box ? box.maxY + size * 1.2 : 120,
    size,
    text: wrap(text, width, size),
    shown: 0,
  };
  aiMarks.push(mark);

  const total = mark.text.length;
  const step = () => {
    mark.shown = Math.min(total, mark.shown + 2);
    redraw();
    if (mark.shown < total) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function wrap(text, maxWidth, size) {
  ctx.font = aiFont(size);                 /* measure in the font it will be drawn in */
  return text.split('\n').map(para => {
    const out = [];
    let line = '';
    for (const word of para.split(' ')) {
      const trial = (line + ' ' + word).trim();
      if (line && ctx.measureText(trial).width > maxWidth) { out.push(line.trim()); line = word; }
      else line = trial;
    }
    if (line.trim()) out.push(line.trim());
    return out.join('\n');
  }).join('\n');
}

/* ============================================================
   PDF — put a worksheet on the board and write on it.
   pdf.js is fetched from cdnjs the first time you ask for it, so the
   board stays light for everyone who never does. Every page is rendered
   once to an offscreen canvas and stacked down the board; ink sits on top.
   ============================================================ */
const PDFJS_URL = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs';
const PDFJS_WORKER = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';
let pdfjsLib = null;

document.getElementById('pdfbtn').onclick = () => document.getElementById('pdffile').click();
document.getElementById('pdffile').addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file) return;
  say('Rendering PDF…');
  try {
    if (!pdfjsLib) {
      pdfjsLib = await import(PDFJS_URL);
      pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
    }
    const doc = await pdfjsLib.getDocument({data: await file.arrayBuffer()}).promise;

    pages.length = 0;
    let y = 0;
    const GAP = 28, RENDER = 2;          /* render at 2x so zooming in stays sharp */
    for (let n = 1; n <= doc.numPages; n++) {
      const page = await doc.getPage(n);
      const vp = page.getViewport({scale: 1});       /* 1 PDF point = 1 board unit */
      const c = document.createElement('canvas');
      c.width = vp.width * RENDER; c.height = vp.height * RENDER;
      await page.render({canvasContext: c.getContext('2d'),
                         viewport: page.getViewport({scale: RENDER})}).promise;
      pages.push({img: c, x: 0, y, w: vp.width, h: vp.height});
      y += vp.height + GAP;
    }
    /* bring page 1 into view under the toolbar, life size */
    zoom = 1; pan = {x: Math.max(24, (innerWidth - pages[0].w) / 2), y: 110};
    redraw();
    say(`${doc.numPages} page${doc.numPages > 1 ? 's' : ''} on the board`);
  } catch (err) {
    say('Could not open that PDF: ' + err.message, true);
  }
  e.target.value = '';                  /* so choosing the same file again re-fires */
});

/* ---- small helpers: say something, or show we're working ---- */
const statusEl = document.getElementById('status');
function say(msg, bad) {
  statusEl.textContent = msg;
  statusEl.className = bad ? 'bad' : '';
}
function busy(on, msg) {
  checkEl.disabled = on;
  checkEl.textContent = on ? (msg || 'Working…') : 'Check my work';
}

fit();
</script>
</body>
</html>
