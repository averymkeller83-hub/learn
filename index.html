/* ============================================================
   THE AI'S INK — strike-throughs and writing, at the student's size
   ============================================================ */
const aiFont = size => `${size}px "Bradley Hand", "Segoe Script", "Comic Sans MS", cursive`;

/* cross out the wrong characters where they sit. The model saw the
   SNAPSHOT, so its box is in snapshot pixels (as thousandths). Undo the
   snapshot's scale and padding to land back on the board. */
function strike([ymin, xmin, ymax, xmax]) {
  if (!shot) return;
  const toBoard = (nx, ny) => ({
    x: (nx / 1000 * shot.w) / shot.SCALE - shot.PAD + shot.box.minX,
    y: (ny / 1000 * shot.h) / shot.SCALE - shot.PAD + shot.box.minY,
  });
  const midY = (ymin + ymax) / 2;
  const a = toBoard(xmin, midY), b = toBoard(xmax, midY);
  const line = {x1: a.x - 6, y1: a.y + 3, x2: b.x + 6, y2: b.y - 3, shown: 0};   /* a slight tilt reads as a hand */
  aiLines.push(line);
  const t0 = performance.now(), MS = 350;
  const step = now => {
    line.shown = Math.min(1, (now - t0) / MS);
    redraw();
    if (line.shown < 1) requestAnimationFrame(step); else dirty();
  };
  requestAnimationFrame(step);
}

/* how big the student writes, so the AI writes the same size: the median
   height of their strokes is close to their letter height (dashes and
   equals signs are too flat to count). Clamped so it never gets silly. */
function handSize() {
  const hs = strokes.map(s => {
    let lo = Infinity, hi = -Infinity;
    for (const q of s.pts) { if (q.y < lo) lo = q.y; if (q.y > hi) hi = q.y; }
    return hi - lo;
  }).filter(h => h > 6).sort((a, b) => a - b);
  if (!hs.length) return 22;
  return Math.max(14, Math.min(72, hs[hs.length >> 1] * 0.95));
}

/* where the AI's writing ends, so the next note goes under it */
function aiBottom() {
  let b = -Infinity;
  for (const m of aiMarks) b = Math.max(b, m.y + m.text.split('\n').length * m.size * 1.35);
  return b;
}

/* the AI's answer, appearing the way a person writes it: below the work
   (or below its own last note), paced by the clock at ~45 characters a
   second, in ink that is only ever its own */
function write(text) {
  const box = bounds();
  const size = handSize();
  let width = box ? box.maxX - box.minX : 0;
  for (const m of aiMarks) width = Math.max(width, markBox(m).maxX - m.x);
  width = Math.max(640, width);                    /* never a skinny column */
  const mark = {
    x: box ? box.minX : 60,
    y: Math.max(box ? box.maxY + size * 1.2 : 140, aiBottom() + size * 0.8),
    size,
    text: wrap(text, width, size),
    shown: 0,
  };
  aiMarks.push(mark);

  const total = mark.text.length, CPS = 45, t0 = performance.now();
  const step = now => {
    mark.shown = Math.min(total, Math.floor((now - t0) / 1000 * CPS));
    redraw();
    if (mark.shown < total) requestAnimationFrame(step); else dirty();
  };
  requestAnimationFrame(step);
}

function wrap(text, maxWidth, size) {
  ctx.font = aiFont(size);                 /* measure in the font it will be drawn in */
  return text.split('\n').map(para => {
    const out = [];
    let line = '';
    for (const word of para.split(' ')) {
      const trial = (line + ' ' + word).trim();
      if (line && ctx.measureText(trial).width > maxWidth) { out.push(line.trim()); line = word; }
      else line = trial;
    }
    if (line.trim()) out.push(line.trim());
    return out.join('\n');
  }).join('\n');
}

/* ============================================================
   PDF — put a worksheet on the page and write on it.
   pdf.js is fetched from cdnjs the first time you ask for it, so the
   board stays light for everyone who never does. Every page is rendered
   once to an offscreen canvas and stacked down the board; ink sits on top.
   ============================================================ */
const PDFJS_URL = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs';
const PDFJS_WORKER = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';
let pdfjsLib = null;

document.getElementById('pdfbtn').onclick = () => document.getElementById('pdffile').click();
document.getElementById('pdffile').addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const bytes = await file.arrayBuffer();
    const rendered = await renderPdf(bytes);
    pages.splice(0, pages.length, ...rendered);
    pdfBytes = bytes;
    /* bring page 1 into view under the toolbar, life size */
    zoom = 1; pan = {x: Math.max(24, (innerWidth - pages[0].w) / 2), y: 120};
    redraw();
    dirty();
  } catch (err) {
    say('Could not open that PDF: ' + err.message, true);
  }
  e.target.value = '';                  /* so choosing the same file again re-fires */
});

/* render every page of a PDF to offscreen canvases, stacked in board coordinates */
async function renderPdf(bytes) {
  say('Rendering PDF…');
  if (!pdfjsLib) {
    pdfjsLib = await import(PDFJS_URL);
    pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
  }
  const doc = await pdfjsLib.getDocument({data: bytes.slice(0)}).promise;   /* pdf.js takes the buffer; give it a copy */
  const out = [];
  let y = 0;
  const GAP = 28, RENDER = 2;          /* render at 2x so zooming in stays sharp */
  for (let n = 1; n <= doc.numPages; n++) {
    const page = await doc.getPage(n);
    const vp = page.getViewport({scale: 1});       /* 1 PDF point = 1 board unit */
    const c = document.createElement('canvas');
    c.width = vp.width * RENDER; c.height = vp.height * RENDER;
    await page.render({canvasContext: c.getContext('2d'),
                       viewport: page.getViewport({scale: RENDER})}).promise;
    out.push({img: c, x: 0, y, w: vp.width, h: vp.height});
    y += vp.height + GAP;
  }
  say(`${doc.numPages} page${doc.numPages > 1 ? 's' : ''} on the board`);
  return out;
}

/* ============================================================
   THE CHAT — a tutor you can talk to, who is looking at the page.

   Every message goes with a picture of the board and the topic, so it
   never answers blind. It replies with two things: what to SAY, and
   (optionally) what to WRITE on the board — a practice problem, a
   worked line. Its writing lands in its own ink, like everything else
   it does. The conversation is saved with the page.
   ============================================================ */
const chatEl = document.getElementById('chat');
const msgsEl = document.getElementById('msgs');
const chatIn = document.getElementById('chatIn');
const chatBtn = document.getElementById('chatBtn');
chatBtn.onclick = () => {
  const open = chatEl.classList.toggle('open');
  chatBtn.setAttribute('aria-pressed', open);
  if (open) chatIn.focus();
};
document.getElementById('chatClose').onclick = () => chatBtn.onclick();

function renderChat() {
  msgsEl.innerHTML = '';
  if (!chat.length) {
    const hello = document.createElement('div');
    hello.className = 'msg ai';
    hello.textContent = "I can see this page. Ask me anything about it, or say \"give me a problem\" and I'll write one on the board.";
    msgsEl.appendChild(hello);
  }
  for (const m of chat) {
    const d = document.createElement('div');
    d.className = 'msg ' + m.role + (m.board ? ' board' : '');
    d.textContent = m.text + (m.board ? '\n✎ written on the board' : '');
    msgsEl.appendChild(d);
  }
  msgsEl.scrollTop = msgsEl.scrollHeight;
}

document.getElementById('chatform').addEventListener('submit', async e => {
  e.preventDefault();
  const text = chatIn.value.trim();
  if (!text) return;
  chatIn.value = '';
  chat.push({role: 'you', text});
  renderChat(); dirty();

  const thinking = document.createElement('div');
  thinking.className = 'msg ai thinking'; thinking.textContent = 'looking at the page…';
  msgsEl.appendChild(thinking); msgsEl.scrollTop = msgsEl.scrollHeight;

  try {
    const s = snapshot();                                /* null on an empty page — that's fine */
    const r = await api('/chat', {
      image: s ? s.url : null,
      context: topic(),
      messages: chat.slice(-16).map(m => ({role: m.role === 'you' ? 'user' : 'model', text: m.text})),
    });
    const board = (r.board || '').trim();
    chat.push({role: 'ai', text: (r.say || '').trim() || '…', board: !!board});
    if (board) write(board);
  } catch (err) {
    chat.push({role: 'ai', text: 'I couldn\'t answer that: ' + err.message});
  }
  renderChat(); dirty();
});

/* ============================================================
   EXPORT — hand the work to wherever it lives next.
   A page becomes a PNG; a notebook becomes a PDF (jsPDF, one page per
   page). On a phone or iPad the share sheet opens — OneNote, Google
   Drive, Files, AirDrop. On a desktop it downloads.
   ============================================================ */
const JSPDF_URL = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
const exportMenu = document.getElementById('exportMenu');
const exportBtn = document.getElementById('exportBtn');
exportBtn.onclick = () => {
  const r = exportBtn.getBoundingClientRect();
  exportMenu.style.left = r.left + 'px'; exportMenu.style.top = (r.bottom + 6) + 'px';
  exportMenu.classList.toggle('open');
};

/* the whole page — PDF pages, ink, and the AI's finished notes — as a canvas */
function renderPageCanvas(maxWidth = 1800) {
  let box = bounds();
  for (const pg of pages) box = union(box, {minX: pg.x, minY: pg.y, maxX: pg.x + pg.w, maxY: pg.y + pg.h});
  const c2 = document.createElement('canvas').getContext('2d');
  for (const m of aiMarks) {
    c2.font = aiFont(m.size);
    const lines = m.text.split('\n');
    const w = Math.max(...lines.map(l => c2.measureText(l).width));
    box = union(box, {minX: m.x, minY: m.y, maxX: m.x + w, maxY: m.y + lines.length * m.size * 1.35});
  }
  if (!box) box = {minX: 0, minY: 0, maxX: 600, maxY: 400};
  const PAD = 48;
  const w = box.maxX - box.minX + PAD * 2, h = box.maxY - box.minY + PAD * 2;
  const scale = Math.min(2, maxWidth / w);
  const off = document.createElement('canvas');
  off.width = Math.round(w * scale); off.height = Math.round(h * scale);
  const o = off.getContext('2d');
  o.fillStyle = '#ffffff'; o.fillRect(0, 0, off.width, off.height);
  o.scale(scale, scale); o.translate(PAD - box.minX, PAD - box.minY);
  paint(o, {revealed: false});
  return off;
}

const toBlob = (canvas, type, q) => new Promise(res => canvas.toBlob(res, type, q));
const safeName = s => (s || 'page').replace(/[^\w\- ]+/g, '').trim().slice(0, 60) || 'page';

/* share sheet where there is one, download where there isn't */
async function deliver(blob, name) {
  const file = new File([blob], name, {type: blob.type});
  if (navigator.canShare && navigator.canShare({files: [file]})) {
    try { await navigator.share({files: [file], title: name}); return say('Shared.'); }
    catch (e) { if (e.name === 'AbortError') return say(''); }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  say('Downloaded ' + name);
}

document.getElementById('expPage').onclick = async () => {
  exportMenu.classList.remove('open');
  const blob = await toBlob(renderPageCanvas(), 'image/png');
  await deliver(blob, safeName(titleEl.value) + '.png');
};

document.getElementById('expNotebook').onclick = async () => {
  exportMenu.classList.remove('open');
  say('Building the PDF…');
  try {
    if (!window.jspdf) await new Promise((res, rej) => {
      const s = document.createElement('script'); s.src = JSPDF_URL; s.onload = res; s.onerror = () => rej(new Error('could not load jsPDF')); document.head.appendChild(s);
    });
    const {jsPDF} = window.jspdf;
    const recs = sheets.filter(s => s.notebook === current.notebook)
                       .sort((a, b) => (a.section + a.title).localeCompare(b.section + b.title));
    await save();
    const keepId = current.id;
    let doc = null;
    for (const rec of recs) {
      const full = (await store.all()).find(s => s.id === rec.id) || rec;
      await openPage(full, {quiet: true});
      const c = renderPageCanvas(1600);
      const wmm = 210, hmm = wmm * c.height / c.width;              /* A4 width, height to fit */
      if (!doc) doc = new jsPDF({unit: 'mm', format: [wmm, hmm]}); else doc.addPage([wmm, hmm]);
      doc.addImage(c.toDataURL('image/jpeg', 0.9), 'JPEG', 0, 0, wmm, hmm);
    }
    const back = (await store.all()).find(s => s.id === keepId);
    if (back) await openPage(back, {quiet: true});
    await deliver(doc.output('blob'), safeName(current.notebook) + '.pdf');
  } catch (e) { say('Export failed: ' + e.message, true); }
};

/* ============================================================
   THE NOTEBOOK — notebooks > sections > pages, saved on this device.

   Every page is one record in IndexedDB. Notebooks and sections are
   just the names on the pages (the way folders are just paths), so an
   empty notebook is created by making its first page. The `store`
   object is the seam: swap its three functions for a server and the
   rest of the notebook never knows.
   ============================================================ */
const store = (() => {
  let db = null, memory = new Map();   /* memory: the fallback when IndexedDB is blocked */
  const open = () => new Promise((res, rej) => {
    try {
      const r = indexedDB.open('showwork', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('pages', {keyPath: 'id'});
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    } catch (e) { rej(e); }
  });
  const tx = (mode, fn) => new Promise((res, rej) => {
    const t = db.transaction('pages', mode);
    const rq = fn(t.objectStore('pages'));
    t.oncomplete = () => res(rq && rq.result);
    t.onerror = () => rej(t.error);
  });
  return {
    async init() { try { db = await open(); return true; } catch { db = null; return false; } },
    all()   { return db ? tx('readonly',  s => s.getAll())   : Promise.resolve([...memory.values()]); },
    put(p)  { return db ? tx('readwrite', s => s.put(p))     : (memory.set(p.id, p), Promise.resolve()); },
    del(id) { return db ? tx('readwrite', s => s.delete(id)) : (memory.delete(id), Promise.resolve()); },
  };
})();

let sheets = [];         /* every saved page */
let current = null;      /* the page on the board right now */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

/* what a page looks like on disk */
function serialize() {
  return {
    id: current.id, notebook: current.notebook, section: current.section, title: titleEl.value,
    topic: topicEl.value, pan: {...pan}, zoom,
    strokes: strokes.map(s => ({color: s.color, width: s.width, pts: s.pts.map(p => ({x: p.x, y: p.y}))})),
    texts: texts.filter(t => t.text.trim()).map(t => ({x: t.x, y: t.y, text: t.text, size: t.size, color: t.color})),
    aiMarks: aiMarks.map(m => ({x: m.x, y: m.y, size: m.size, text: m.text, shown: m.text.length})),
    aiLines: aiLines.map(l => ({x1: l.x1, y1: l.y1, x2: l.x2, y2: l.y2, shown: 1})),
    chat: chat.map(m => ({role: m.role, text: m.text, board: !!m.board})),
    exam: current.exam || null,
    created: current.created || Date.now(),
    pdf: pdfBytes,
    updated: Date.now(),
  };
}

/* autosave: many changes in a burst become one write, ~600ms after the last */
let saveTimer = null;
function dirty() {
  if (!current) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(save, 600);
}
async function save() {
  if (!current) return;
  clearTimeout(saveTimer);
  const rec = serialize();
  Object.assign(current, {title: rec.title, updated: rec.updated});
  try {
    await store.put(rec);
    document.getElementById('saveNote').textContent =
      'Saved ' + new Date().toLocaleTimeString([], {hour: 'numeric', minute: '2-digit'});
  } catch (e) { say('Could not save: ' + e.message, true); }
}

async function openPage(rec, {quiet = false} = {}) {
  clearTimeout(saveTimer);
  if (current && current.id !== rec.id) await save();     /* never lose the page we're leaving */

  current = sheets.find(s => s.id === rec.id) || rec;
  current.exam = rec.exam || null;
  current.created = rec.created || rec.updated;
  if (editing) commitText();
  strokes.length = 0; strokes.push(...(rec.strokes || []));
  texts.length = 0;   texts.push(...(rec.texts || []));
  aiMarks.length = 0; aiMarks.push(...(rec.aiMarks || []));
  aiLines.length = 0; aiLines.push(...(rec.aiLines || []));
  chat.length = 0;    chat.push(...(rec.chat || []));
  history.length = 0;
  pages.length = 0; pdfBytes = rec.pdf || null;
  pan = rec.pan ? {...rec.pan} : {x: 0, y: 0};
  zoom = rec.zoom || 1;
  titleEl.value = rec.title || '';
  topicEl.value = rec.topic || '';
  showRead.hidden = true; if (!quiet) say('');
  if (pdfBytes) {
    try { pages.push(...await renderPdf(pdfBytes)); }
    catch (e) { say('Could not re-open this page\'s PDF: ' + e.message, true); }
  }
  applyExamState(); redraw(); renderChat(); renderSide();
  try { localStorage.setItem('showwork.last', current.id); } catch {}
}

async function newPage(notebook, section, title) {
  const rec = {id: uid(), notebook, section, title: title || 'Untitled page', topic: '', created: Date.now(),
               strokes: [], aiMarks: [], aiLines: [], chat: [], pdf: null, pan: {x: 0, y: 0}, zoom: 1, updated: Date.now()};
  sheets.push(rec);
  await store.put(rec);
  await openPage(rec);
  titleEl.focus(); titleEl.select();
}

/* ---- the sidebar ---- */
const sideEl = document.getElementById('side');
const nbSel = document.getElementById('nbSel');
const WIDE = () => innerWidth >= 1100;
function setSide(open) {
  sideEl.classList.toggle('open', open);
  document.body.classList.toggle('side-open', open && WIDE());
  redraw();
}
document.getElementById('sideBtn').onclick = () => setSide(!sideEl.classList.contains('open'));
document.getElementById('sideClose').onclick = () => setSide(false);
addEventListener('resize', () => document.body.classList.toggle('side-open', sideEl.classList.contains('open') && WIDE()));

/* section colours, like OneNote's coloured tabs — stable per name */
const SECTION_COLORS = ['#e8a33d', '#5b8def', '#d95f9a', '#5fb36b', '#a56cc1', '#e07b53', '#4bb3c9', '#c7b13f'];
const sectionColor = name => { let h = 0; for (const ch of name) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return SECTION_COLORS[h % SECTION_COLORS.length]; };
const whenText = ts => { const d = new Date(ts); const today = new Date().toDateString() === d.toDateString();
  return today ? d.toLocaleTimeString([], {hour: 'numeric', minute: '2-digit'}) : d.toLocaleDateString([], {month: 'short', day: 'numeric'}); };

function renderSide() {
  if (!current) return;
  const notebooks = [...new Set(sheets.map(s => s.notebook))].sort();
  nbSel.innerHTML = notebooks.map(n => `<option${n === current.notebook ? ' selected' : ''}>${esc(n)} ▾</option>`).join('');

  const secs = [...new Set(sheets.filter(s => s.notebook === current.notebook).map(s => s.section))].sort();
  const secList = document.getElementById('secList');
  secList.innerHTML = '';
  for (const sec of secs) {
    const b = document.createElement('button');
    b.className = 'item';
    b.setAttribute('aria-current', sec === current.section);
    const tab = document.createElement('span'); tab.className = 'tab'; tab.style.background = sectionColor(sec);
    const name = document.createElement('span'); name.className = 'name'; name.textContent = sec;
    b.append(tab, name);
    b.onclick = async () => {
      const first = sheets.filter(s => s.notebook === current.notebook && s.section === sec)
                          .sort((a, b) => b.updated - a.updated)[0];
      if (first) await openPage(await fullRecord(first));
    };
    secList.appendChild(b);
  }

  const pageList = document.getElementById('pageList');
  pageList.innerHTML = '';
  const inSec = sheets.filter(s => s.notebook === current.notebook && s.section === current.section)
                      .sort((a, b) => b.updated - a.updated);
  for (const pg of inSec) {
    const b = document.createElement('button');
    b.className = 'item';
    b.setAttribute('aria-current', pg.id === current.id);
    const body = document.createElement('span'); body.className = 'body';
    const name = document.createElement('span'); name.className = 'name'; name.textContent = pg.title || 'Untitled page';
    const when = document.createElement('span'); when.className = 'when'; when.textContent = whenText(pg.updated) + (pg.exam ? ' · practice exam' : '');
    body.append(name, when);
    const del = document.createElement('span'); del.className = 'del'; del.textContent = '✕'; del.title = 'Delete this page';
    del.onclick = async ev => {
      ev.stopPropagation();
      if (sheets.length === 1) return say('Keep at least one page.', true);
      sheets = sheets.filter(s => s.id !== pg.id);
      await store.del(pg.id);
      if (pg.id === current.id) { current = null; await openPage(await fullRecord(pickStart())); } else renderSide();
    };
    b.append(body, del);
    b.onclick = async () => openPage(await fullRecord(pg));
    pageList.appendChild(b);
  }

  /* the date under the title, the way OneNote stamps a page */
  const d = new Date(current.created || current.updated || Date.now());
  document.getElementById('pageDate').textContent =
    d.toLocaleDateString([], {weekday: 'long', month: 'long', day: 'numeric', year: 'numeric'}) + '  ·  ' +
    d.toLocaleTimeString([], {hour: 'numeric', minute: '2-digit'});
}
const esc = s => s.replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));

/* sheets[] holds what we loaded at start; the store has the latest bytes */
async function fullRecord(rec) {
  return (await store.all()).find(s => s.id === rec.id) || rec;
}

nbSel.onchange = async () => {
  const nb = nbSel.value.replace(/ ▾$/, '');
  const first = sheets.filter(s => s.notebook === nb).sort((a, b) => b.updated - a.updated)[0];
  if (first) await openPage(await fullRecord(first));
};
document.getElementById('nbAdd').onclick = async () => {
  /* a new notebook is its first page; type the notebook's name where the select is */
  const n = 'Notebook ' + ([...new Set(sheets.map(s => s.notebook))].length + 1);
  await newPage(n, 'Notes', 'Page 1');
  say('New notebook created as "' + n + '" — rename it from the list when you like.');
};
document.getElementById('secNew').addEventListener('keydown', async e => {
  if (e.key !== 'Enter') return;
  const name = e.target.value.trim();
  if (!name) return;
  e.target.value = '';
  await newPage(current.notebook, name, 'Page 1');
});
document.getElementById('pageAdd').onclick = () => {
  const n = sheets.filter(s => s.notebook === current.notebook && s.section === current.section).length + 1;
  newPage(current.notebook, current.section, 'Page ' + n);
};

/* ============================================================
   PRACTICE EXAM — a fresh page of problems on whatever you're working
   on. The tutor writes five problems (no solutions, no hints); they
   land on a NEW page in this section, in its ink, with room under each
   to work. Then it's Check my work, one problem at a time.
   ============================================================ */
document.getElementById('examBtn2').onclick = () => document.getElementById('examBtn').onclick();
document.getElementById('examBtn').onclick = async () => {
  const t = topic() || titleEl.value.trim();
  if (!t) return say("Type what you're working on in the topic line first.", true);
  if (!WIDE()) setSide(false);
  say('Writing a practice exam on ' + t + '…');
  try {
    const r = await api('/chat', {image: null, context: t, messages: [{role: 'user', text:
      `Write a practice exam of 5 problems on: ${t}. Match the difficulty of a college homework set on this topic. ` +
      `Put ALL five problems in "board", numbered "1." to "5.", ONE problem per line, plain-text math (write sqrt(x), x^(-2), (a/b) — NO LaTeX, no backslashes), NO solutions and NO hints. ` +
      `In "say", one sentence telling me to work them on the page and check each one.`}]});
    const lines = (r.board || '').split('\n').map(l => l.trim()).filter(l => /^\d+[.)]/.test(l) || l.length > 3);
    if (!lines.length) throw new Error('no problems came back');

    await newPage(current.notebook, current.section, 'Practice — ' + t.slice(0, 40));
    topicEl.value = t;
    current.exam = {locked: true, n: lines.length, graded: false};   /* tutor off until "I'm done" */
    const size = 24, ROOM = 170;                    /* ~4 lines of handwriting under each problem */
    let y = 40;
    for (const line of lines) {
      const text = wrap(line, 900, size);
      aiMarks.push({x: 60, y, size, text, shown: text.length});
      y += text.split('\n').length * size * 1.35 + ROOM;
    }
    pan = {x: 0, y: 110}; zoom = 1;
    chat.push({role: 'ai', text: (r.say || '').trim() || 'Work these on the page, then check each one.'});
    applyExamState(); redraw(); renderChat(); dirty();
    say(lines.length + ' problems on the page. The tutor is locked until you tap "I\'m done".');
  } catch (e) { say('Could not make the exam: ' + e.message, true); }
};

/* which page to open first: the one you were on, else the newest */
function pickStart() {
  let last = null;
  try { last = localStorage.getItem('showwork.last'); } catch {}
  return sheets.find(s => s.id === last) || sheets.slice().sort((a, b) => b.updated - a.updated)[0];
}

/* ---- small helpers: say something, or show we're working ---- */
const statusEl = document.getElementById('status');
function say(msg, bad) {
  statusEl.textContent = msg;
  statusEl.className = bad ? 'bad' : '';
}
function busy(on, msg) {
  checkEl.disabled = on;
  checkEl.textContent = on ? (msg || 'Working…')
    : (examOpen() && current.exam.locked ? "I'm done — grade it" : 'Check my work');
}

/* ============================================================
   START — open the store, load the pages, open where you left off.
   ============================================================ */
(async () => {
  fit();
  loadPrompts();                                     /* for bring-your-own-key calls */
  const persistent = await store.init();
  if (!persistent) document.getElementById('saveNote').textContent = 'Storage is blocked here — this session won\'t be saved';
  sheets = await store.all();
  if (!sheets.length) await newPage('My Notebook', 'Notes', 'Page 1');
  else await openPage(pickStart());
  if (WIDE()) setSide(true);                         /* OneNote keeps its columns open on a wide screen */
})();
</script>
