<!DOCTYPE html>
<!--
  Showwork — a notebook you handwrite in, with a tutor built in.

  THE WHOLE PAGE IN SIX STEPS:
    1. Notebooks hold sections, sections hold pages. Every page is a board.
       Everything you do is saved on this device as you do it.
    2. You write on the board. Pen and mouse draw; fingers pan and zoom, never draw.
    3. "Check my work" sends a picture of the page to our own server. It reads
       your handwriting and — if it wasn't sure of something — asks you first.
    4. Then it finds the FIRST mistake, crosses it out where it sits, and writes
       how to do that one step, in its own reserved colour, at your size.
    5. The chat sees the same picture. Talk to it; it can ask you questions
       back, and when it wants to SHOW you something it writes on the board.
    6. Export hands a page (image) or a notebook (PDF) to the share sheet —
       OneNote, Google Drive, Files, AirDrop — or downloads it on a desktop.

  The reading-back step exists because on 2026-09-17 two of three readers misread
  the same handwritten fraction. A tutor that confidently misreads your work and
  corrects you for a mistake you never made is worse than no tutor at all.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Showwork</title>
<style>
  /* ============================================================
     THE PALETTE — muted, paper-like. The AI's amber is reserved:
     it is never offered as a pen colour, so its marks can never be
     mistaken for the student's.
     ============================================================ */
  :root {
    --paper:   #fbfaf7;
    --line:    #e7e3da;
    --ui:      #ffffff;
    --edge:    #d9d4c9;
    --text:    #2e2c28;
    --muted:   #7a746a;
    --ai-ink:  #c2410c;   /* RESERVED. Never a student colour. */
    --accent:  #7719aa;   /* OneNote purple */
    --accent-dark: #5e1287;
    --side:    #f4f1ea;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--paper); color: var(--text);
    font: 15px/1.5 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
    overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none;
  }

  /* ---- the board fills everything; the UI floats over it ---- */
  #board { position: fixed; inset: 0; display: block; cursor: crosshair; touch-action: none;
           -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
  #board.erasing { cursor: cell; }

  /* ============================================================
     THE RIBBON — OneNote's: a purple title strip with Home · Insert ·
     Draw, and under it a white row of icon-over-label buttons.
     ============================================================ */
  #ribbon { position: fixed; top: 0; left: 0; right: 0; z-index: 20; background: var(--ui);
            border-bottom: 1px solid var(--edge); box-shadow: 0 1px 8px rgba(0,0,0,.06); }
  body.side-open #ribbon { left: 470px; }
  .rtop { display: flex; align-items: center; gap: 4px; height: 44px; padding: 0 10px 0 6px; background: var(--accent); color: #fff; }
  .rtop .app { font-weight: 700; font-size: 15px; margin: 0 14px 0 4px; letter-spacing: .01em; display: flex; align-items: center; gap: 8px; }
  .rtop .tabs { display: flex; gap: 2px; height: 100%; }
  .rtop .tab { border: 0; background: transparent; color: rgba(255,255,255,.85); font: inherit; font-size: 14px; padding: 0 14px;
               cursor: pointer; height: 100%; border-bottom: 3px solid transparent; }
  .rtop .tab[aria-selected="true"] { color: #fff; border-bottom-color: #fff; font-weight: 600; }
  .rtop .grow { flex: 1; }
  .rtop .ibtn { border: 0; background: transparent; color: #fff; width: 36px; height: 36px; border-radius: 6px; cursor: pointer; display: grid; place-items: center; }
  .rtop .ibtn:hover { background: rgba(255,255,255,.14); }
  .rtop button.primary { background: #fff; color: var(--accent); border-color: #fff; }
  .rtop button.primary:hover:not(:disabled) { background: #f1e6f7; }
  .rpanel { display: flex; align-items: stretch; gap: 2px; height: 66px; padding: 4px 10px; overflow-x: auto; }
  .rpanel[hidden] { display: none; }
  .rbtn { border: 1px solid transparent; background: transparent; color: var(--text); font: inherit; font-size: 11.5px; line-height: 1.1;
          border-radius: 6px; padding: 5px 9px 4px; min-width: 58px; cursor: pointer; display: flex; flex-direction: column; align-items: center;
          justify-content: center; gap: 5px; white-space: nowrap; flex: none; }
  .rbtn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; color: #4a4560; }
  .rbtn:hover:not(:disabled) { background: #f3eef8; border-color: #e6dcef; }
  .rbtn[aria-pressed="true"] { background: #ede2f5; border-color: var(--accent); }
  .rbtn[aria-pressed="true"] svg { color: var(--accent); }
  .rbtn:disabled { opacity: .4; cursor: not-allowed; }
  .rpanel .group { display: flex; align-items: center; gap: 2px; padding: 0 8px; border-right: 1px solid var(--edge); margin-right: 6px; }
  .rpanel .group:last-child { border-right: 0; }
  .pens { display: flex; gap: 8px; align-items: center; padding: 0 6px; }
  .pen { width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; flex: none;
         box-shadow: inset 0 0 0 2px #fff; }
  .pen[aria-pressed="true"] { border-color: var(--accent); transform: scale(1.12); }
  .sep { width: 1px; height: 24px; background: var(--edge); flex: none; }

  button.act {
    border: 1px solid var(--edge); background: var(--ui); color: var(--text);
    border-radius: 8px; padding: 7px 12px; cursor: pointer; font-size: 14px;
    font-family: inherit; white-space: nowrap; flex: none;
  }
  button.act:hover:not(:disabled) { background: #f4f1ea; }
  button.act:disabled { opacity: .45; cursor: not-allowed; }
  button.act[aria-pressed="true"] { background: #ede2f5; border-color: var(--accent); }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
  button.icon { padding: 7px 10px; font-size: 16px; line-height: 1; }

  /* typing on the page: the live text box, in the page's font */
  #textEdit { position: fixed; z-index: 18; display: none; min-width: 120px; min-height: 1.4em; padding: 2px 4px; margin: 0;
              border: 1px dashed var(--accent); border-radius: 3px; background: rgba(255,255,255,.7); color: var(--text);
              font-family: ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif; line-height: 1.3; resize: none; overflow: hidden;
              outline: none; -webkit-user-select: text; user-select: text; }
  #board.typing { cursor: text; }

  /* the selection bar appears when something is circled */
  #selBar { position: fixed; top: 120px; left: 50%; transform: translateX(-50%); z-index: 22; display: none; gap: 8px;
            align-items: center; padding: 6px 8px 6px 12px; background: var(--ui); border: 1px solid var(--edge);
            border-radius: 10px; box-shadow: 0 4px 18px rgba(0,0,0,.09); font-size: 13px; color: var(--muted); }
  #selBar.on { display: flex; }
  #board.selecting { cursor: default; }

  /* the export menu drops from its button */
  #exportMenu { position: fixed; z-index: 21; display: none; flex-direction: column; gap: 4px; padding: 6px;
                background: var(--ui); border: 1px solid var(--edge); border-radius: 10px; box-shadow: 0 4px 18px rgba(0,0,0,.09); }
  #exportMenu.open { display: flex; }
  #exportMenu button { text-align: left; border: 0; }

  /* ---- the page header, on the page like OneNote: big title, the date under it ---- */
  #meta {
    position: fixed; top: 124px; left: 28px; width: min(560px, calc(100vw - 56px)); z-index: 19;
    display: flex; flex-direction: column; gap: 2px; pointer-events: none;
  }
  #meta input { pointer-events: auto; border: 0; background: transparent; font: inherit; color: var(--text); padding: 4px 6px; margin-left: -6px; border-radius: 6px;
                -webkit-user-select: text; user-select: text; }
  #meta input:focus { background: var(--ui); outline: 1px solid var(--edge); }
  #title { font-size: 24px; font-weight: 700; line-height: 1.2; }
  #pageDate { font-size: 12.5px; color: var(--muted); padding-left: 0; }
  #topic { font-size: 13.5px; color: var(--muted); }
  #meta input::placeholder { color: var(--muted); font-weight: 400; }

  /* ============================================================
     THE SIDEBAR — OneNote's three columns: notebook, sections, pages.
     Sections carry a colour tab; pages show their title and date.
     Open by default on a wide screen, an overlay on a narrow one.
     ============================================================ */
  #side {
    position: fixed; top: 0; left: 0; bottom: 0; width: min(470px, 100vw); z-index: 30;
    box-shadow: 2px 0 12px rgba(0,0,0,.05);
    background: var(--side); border-right: 1px solid var(--edge);
    transform: translateX(-100%); transition: transform .18s ease;
    display: flex; flex-direction: column;
    -webkit-user-select: text; user-select: text;
  }
  #side.open { transform: none; }
  #side .nb { display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 8px 0 12px; background: var(--accent); color: #fff; }
  #side .nb select { color: #fff; }
  #side .nb .act { background: transparent; color: #fff; border-color: rgba(255,255,255,.35); }
  #side .nb .act:hover { background: rgba(255,255,255,.14); }
  #side .nb svg { width: 20px; height: 20px; fill: none; stroke: #fff; stroke-width: 1.7; flex: none; }
  #side .nb select { flex: 1; min-width: 0; font: inherit; font-size: 15px; font-weight: 700; padding: 6px 4px;
                     border: 0; background: transparent; appearance: none; -webkit-appearance: none; cursor: pointer; }
  #side .nb select option { color: var(--text); }
  #side .cols { flex: 1; display: flex; min-height: 0; }
  #side .col { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  #side .col.sections { width: 196px; border-right: 1px solid var(--edge); background: #efebe2; }
  #side .col.pages { flex: 1; background: var(--side); }
  #side .col h3 { margin: 10px 12px 4px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  #side .list { flex: 1; overflow: auto; padding: 4px 8px; display: flex; flex-direction: column; gap: 2px; }
  #side .item {
    text-align: left; border: 1px solid transparent; background: transparent; color: var(--text); font: inherit; font-size: 14px;
    padding: 8px 10px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 10px;
    min-width: 0; max-width: 100%;
  }
  #side .item:hover { background: rgba(0,0,0,.05); }
  #side .item[aria-current="true"] { background: var(--ui); border-color: var(--edge); }
  #side .item .tab { width: 4px; height: 22px; border-radius: 2px; flex: none; }           /* the section colour */
  #side .item .body { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  #side .item .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #side .item .when { font-size: 12px; color: var(--muted); }
  #side .item .del { color: var(--muted); font-size: 12px; padding: 0 4px; }
  #side .item .del:hover { color: #a33; }
  #side .col .add { margin: 6px 8px; text-align: left; }
  #side input.new { margin: 6px 8px; font: inherit; font-size: 14px; padding: 7px 10px;
                    border: 1px solid var(--edge); border-radius: 8px; background: var(--ui); color: var(--text); }
  #side .foot { font-size: 12px; color: var(--muted); padding: 8px 12px; border-top: 1px solid var(--edge); }

  /* when the sidebar is open on a wide screen, the page's chrome moves right of it */
  body.side-open #meta { left: 498px; width: min(560px, calc(100vw - 470px - 56px)); }
  @media (max-width: 1099px) { body.side-open #ribbon { left: 0; } body.side-open #meta { left: 28px; } }

  /* ============================================================
     THE CHAT — talk to the tutor. It sees the board every time.
     ============================================================ */
  #chat {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(360px, 100vw); z-index: 30;
    background: var(--ui); border-left: 1px solid var(--edge);
    transform: translateX(100%); transition: transform .18s ease;
    display: flex; flex-direction: column;
    -webkit-user-select: text; user-select: text;
  }
  #chat.open { transform: none; }
  #chat header { padding: 14px 16px 10px; border-bottom: 1px solid var(--edge); display: flex; justify-content: space-between; align-items: center; }
  #chat header b { font-size: 14px; }
  #msgs { flex: 1; overflow: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 88%; padding: 8px 12px; border-radius: 12px; font-size: 14px; line-height: 1.45; white-space: pre-wrap; }
  .msg.you { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .msg.ai  { align-self: flex-start; background: var(--side); border-bottom-left-radius: 4px; }
  .msg.ai.board { border-left: 3px solid var(--ai-ink); }
  .msg.thinking { color: var(--muted); font-style: italic; background: transparent; }
  #chatform { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--edge); }
  #chatform input { flex: 1; min-width: 0; font: inherit; font-size: 14px; padding: 9px 12px; border: 1px solid var(--edge); border-radius: 10px; background: var(--paper); color: var(--text); }

  /* ============================================================
     THE READ-BACK PANEL — only when the model wasn't sure.
     ============================================================ */
  #panel {
    position: fixed; left: 50%; top: 130px; transform: translateX(-50%); width: min(420px, calc(100vw - 32px));
    max-height: calc(100vh - 140px); overflow: auto;
    background: var(--ui); border: 1px solid var(--edge); border-radius: 12px;
    box-shadow: 0 4px 22px rgba(0,0,0,.09); padding: 16px; z-index: 25; display: none;
    -webkit-user-select: text; user-select: text;
  }
  #panel.on { display: block; }
  #panel h2 { margin: 0 0 4px; font-size: 15px; }
  #panel .why { margin: 0 0 11px; font-size: 13px; color: var(--muted); }
  #read {
    width: 100%; min-height: 170px; resize: vertical;
    font: 13px/1.6 ui-monospace, "SF Mono", Menlo, monospace;
    color: var(--text); background: var(--paper);
    border: 1px solid var(--edge); border-radius: 8px; padding: 10px;
  }
  #panel .row { display: flex; gap: 8px; margin-top: 11px; }
  #panel .row button { flex: 1; }

  /* settings: bring your own key */
  #settings {
    position: fixed; left: 50%; top: 130px; transform: translateX(-50%); width: min(440px, calc(100vw - 32px));
    background: var(--ui); border: 1px solid var(--edge); border-radius: 12px;
    box-shadow: 0 4px 22px rgba(0,0,0,.09); padding: 16px; z-index: 25; display: none;
    -webkit-user-select: text; user-select: text;
  }
  #settings.on { display: block; }
  #settings h2 { margin: 0 0 6px; font-size: 15px; }
  #settings p { margin: 0 0 10px; font-size: 13.5px; }
  #settings p.fine { font-size: 12.5px; color: var(--muted); }
  #settings a { color: var(--accent); }
  #settings input { width: 100%; font: inherit; font-size: 14px; padding: 9px 12px; border: 1px solid var(--edge); border-radius: 9px; background: var(--paper); color: var(--text); }
  #settings .row { display: flex; gap: 8px; margin-top: 10px; }
  #settings .row button { flex: 1; }

  #status { position: fixed; left: 16px; bottom: 14px; z-index: 10; font-size: 13px; color: var(--muted); max-width: 50vw; }
  #status.bad { color: #a33; }
  #showRead { position: fixed; left: 16px; bottom: 40px; z-index: 10; font-size: 12.5px; padding: 5px 10px; }
  #hint { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 5; font-size: 12.5px; color: var(--muted); pointer-events: none; }
</style>
</head>
<body>

<canvas id="board"></canvas>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 0-3 3z"/><path d="M5 4v16a3 3 0 0 1 3-3h11"/></symbol>
  <symbol id="i-pen" viewBox="0 0 24 24"><path d="M14.5 4.5l5 5L8 21H3v-5z"/><path d="M12.5 6.5l5 5"/></symbol>
  <symbol id="i-thick" viewBox="0 0 24 24"><path d="M4 7h16" stroke-width="1"/><path d="M4 12h16" stroke-width="2.5"/><path d="M4 18h16" stroke-width="4.5"/></symbol>
  <symbol id="i-eraser" viewBox="0 0 24 24"><path d="M15 4l5 5-9 9H8l-4-4 11-10z"/><path d="M6 20h14"/><path d="M9.5 9.5l5 5"/></symbol>
  <symbol id="i-lasso" viewBox="0 0 24 24"><path d="M12 4c5 0 8 2.2 8 5s-3 5-8 5-8-2.2-8-5 3-5 8-5z" stroke-dasharray="3 2.5"/><path d="M7 14c-1 2 0 4 1.5 5.5S11 21 11 21"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 7L4 12l5 5"/><path d="M4 12h9a6 6 0 0 1 0 12h-1" transform="translate(0 -6)"/></symbol>
  <symbol id="i-redo" viewBox="0 0 24 24"><path d="M15 7l5 5-5 5"/><path d="M20 12h-9a6 6 0 0 0 0 12h1" transform="translate(0 -6)"/></symbol>
  <symbol id="i-clear" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></symbol>
  <symbol id="i-text" viewBox="0 0 24 24"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h6"/></symbol>
  <symbol id="i-exam" viewBox="0 0 24 24"><path d="M5 4h14v17H5z"/><path d="M8 9h3M8 13h3M8 17h3"/><path d="M13.5 9l1 1 2-2M13.5 13l1 1 2-2"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12.5h5"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 15V4M8 8l4-4 4 4"/><path d="M5 13v7h14v-7"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></symbol>
</svg>

<div id="ribbon">
  <div class="rtop">
    <button class="ibtn" id="sideBtn" title="Notebooks"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><use href="#i-menu"/></svg></button>
    <div class="app"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><use href="#i-book"/></svg>Showwork</div>
    <div class="tabs" id="tabs">
      <button class="tab" data-tab="home">Home</button>
      <button class="tab" data-tab="insert">Insert</button>
      <button class="tab" data-tab="draw" aria-selected="true">Draw</button>
    </div>
    <div class="grow"></div>
    <button class="act primary" id="check">Check my work</button>
  </div>

  <div class="rpanel" data-panel="home" hidden>
    <div class="group">
      <button class="rbtn" id="chatBtn" aria-pressed="false" title="Talk to the tutor"><svg><use href="#i-chat"/></svg><span>Tutor</span></button>
      <button class="rbtn" id="exportBtn" title="Send this page or notebook to OneNote, Drive, Files…"><svg><use href="#i-share"/></svg><span>Export</span></button>
    </div>
    <div class="group">
      <button class="rbtn" id="setBtn" title="Settings — use your own Gemini key"><svg><use href="#i-gear"/></svg><span>Settings</span></button>
    </div>
  </div>

  <div class="rpanel" data-panel="insert" hidden>
    <div class="group">
      <button class="rbtn" id="textBtn" aria-pressed="false" title="Type on the page"><svg><use href="#i-text"/></svg><span>Text</span></button>
      <button class="rbtn" id="pdfbtn" title="Put a PDF on this page to write on"><svg><use href="#i-file"/></svg><span>PDF</span></button>
      <input type="file" id="pdffile" accept="application/pdf" hidden>
    </div>
    <div class="group">
      <button class="rbtn" id="examBtn2" title="A new page of practice problems on your topic"><svg><use href="#i-exam"/></svg><span>Practice exam</span></button>
    </div>
  </div>

  <div class="rpanel" data-panel="draw">
    <div class="group">
      <div class="pens" id="pens"></div>
      <button class="rbtn" id="thick" title="Pen thickness"><svg><use href="#i-thick"/></svg><span id="thickLabel">Medium</span></button>
    </div>
    <div class="group">
      <button class="rbtn" id="eraser" aria-pressed="false" title="Eraser — touch a stroke to remove it"><svg><use href="#i-eraser"/></svg><span>Eraser</span></button>
      <button class="rbtn" id="select" aria-pressed="false" title="Select — circle anything to move or delete it"><svg><use href="#i-lasso"/></svg><span>Lasso Select</span></button>
    </div>
    <div class="group">
      <button class="rbtn" id="undo" title="Undo"><svg><use href="#i-undo"/></svg><span>Undo</span></button>
      <button class="rbtn" id="redo" title="Redo"><svg><use href="#i-redo"/></svg><span>Redo</span></button>
      <button class="rbtn" id="clear" title="Clear the ink on this page (keeps the PDF)"><svg><use href="#i-clear"/></svg><span>Clear ink</span></button>
    </div>
  </div>
</div>
<textarea id="textEdit" rows="1" spellcheck="false"></textarea>

<div id="selBar">
  <span id="selCount"></span>
  <button class="act" id="selDelete">Delete</button>
  <button class="act" id="selDone">Done</button>
</div>
<div id="exportMenu">
  <button class="act" id="expPage">This page → image</button>
  <button class="act" id="expNotebook">This notebook → PDF</button>
</div>

<div id="meta">
  <input id="title" placeholder="Untitled page" autocomplete="off" spellcheck="false">
  <div id="pageDate"></div>
  <input id="topic" placeholder="What are you working on? e.g. M220 — tangent lines" autocomplete="off" spellcheck="false">
</div>

<aside id="side">
  <div class="nb">
    <svg><use href="#i-book"/></svg>
    <select id="nbSel" title="Switch notebook"></select>
    <button class="act icon" id="nbAdd" title="New notebook">+</button>
    <button class="act icon" id="sideClose" title="Hide">‹</button>
  </div>
  <div class="cols">
    <div class="col sections">
      <h3>Sections</h3>
      <div class="list" id="secList"></div>
      <input class="new" id="secNew" placeholder="New section… (Enter)">
    </div>
    <div class="col pages">
      <h3>Pages</h3>
      <div class="list" id="pageList"></div>
      <button class="act add" id="pageAdd">+ Page</button>
      <button class="act add" id="examBtn" title="A new page of practice problems on your topic">✎ Practice exam</button>
    </div>
  </div>
  <div class="foot" id="saveNote">Saved on this device</div>
</aside>

<aside id="chat">
  <header><b>Tutor</b><button class="act icon" id="chatClose" title="Close">×</button></header>
  <div id="msgs"></div>
  <form id="chatform">
    <input id="chatIn" placeholder="Ask, or say 'give me a problem'" autocomplete="off">
    <button class="act primary" type="submit">Send</button>
  </form>

<div id="panel">
  <h2 id="panelTitle">Here's what I read</h2>
  <p class="why" id="panelWhy"></p>
  <textarea id="read" spellcheck="false"></textarea>
  <div class="row">
    <button class="act" id="cancel">Cancel</button>
    <button class="act primary" id="confirm">Check it</button>
  </div>
</div>

<div id="status"></div>
<button class="act" id="showRead" hidden title="See or fix what was read from your handwriting">What I read ▸</button>
<div id="hint">Draw: pen or mouse · Insert › Text to type · Lasso to move or delete · two fingers pan and zoom</div>

<script>
/* ============================================================
   THE STATE — everything the board knows about the CURRENT page.

   strokes[] is the memory. Undo pops it, clear empties it, and every
   redraw is just "walk the list and draw it again". The AI's writing
   lives in its OWN lists so it can never be undone by the student's
   undo, and never blends into their work. Switching pages swaps what
   is IN these lists — the lists themselves never change identity.
   ============================================================ */
const PENS   = ['#2e2c28', '#1d4ed8', '#166534', '#7c2d12'];  /* no amber here */
const AI_INK = '#c2410c';                                      /* reserved */

const strokes = [];      /* [{color, width, pts:[{x,y}]}]  — the student's */
const texts   = [];      /* [{x, y, text, size, color}]     — typed on the page, OneNote-style */
const pages   = [];      /* [{img, x, y, w, h}] — a PDF's pages, stacked, UNDER the ink */
const aiMarks = [];      /* [{x, y, size, text, shown}]    — the AI's writing */
const aiLines = [];      /* [{x1,y1,x2,y2, shown}]         — the AI's strike-throughs */
const chat    = [];      /* [{role:'you'|'ai', text, board?}] — this page's conversation */
let pdfBytes  = null;    /* the PDF on this page, so it can be saved and re-rendered */

let pen = PENS[0];
let thickness = 1;       /* pen size multiplier: fine .7 · medium 1 · bold 1.6 */
let tool = 'pen';        /* 'pen', 'eraser' or 'select' */
let drawing = null;      /* the stroke in progress */
let erasing = null;      /* strokes removed during ONE eraser drag, for undo */
let lasso = null;        /* the loop being drawn with the Select tool */
let selection = null;    /* {strokes:[], marks:[], lines:[]} — what the loop caught */
let moving = null;       /* {last:{x,y}, dx, dy} while dragging a selection */

/* history[] is what undo walks. Every action is either
     {type:'add',   stroke}          — a stroke was drawn
     {type:'erase', strokes:[...]}   — one eraser drag removed these
   so undo can put back exactly what one gesture took away. */
const history = [];
const redoStack = [];    /* what undo took back; any new action clears it */
function record(action) { history.push(action); redoStack.length = 0; }
let pan = {x: 0, y: 0};  /* how far the board has been dragged */
let zoom = 1;            /* 1 = life size; pinch or trackpad changes it */
let panFrom = null;      /* where a finger-drag started */
const touches = new Map();  /* live fingers, id -> {x,y}; two of them = a pinch */
let pinch = null;           /* {dist, mid, zoom0, pan0} while two fingers are down */

const cv  = document.getElementById('board');
const ctx = cv.getContext('2d');
const PAPER = getCSS('--paper'), RULE = getCSS('--line');   /* read once, not per frame */

/* ============================================================
   fit — size the canvas to the window at real device resolution.
   Without the devicePixelRatio scaling, handwriting looks furry on
   a retina screen, and the vision model has to read furry ink.
   ============================================================ */
function fit() {
  const r = window.devicePixelRatio || 1;
  cv.width  = Math.floor(innerWidth  * r);
  cv.height = Math.floor(innerHeight * r);
  cv.style.width  = innerWidth  + 'px';
  cv.style.height = innerHeight + 'px';
  ctx.setTransform(r, 0, 0, r, 0, 0);
  redraw();
}
addEventListener('resize', fit);

/* ============================================================
   redraw — the whole board, from the lists, every time.
   Simple beats clever: no partial repainting to get wrong, and at
   handwriting scale it is far faster than it needs to be.
   ============================================================ */
function redraw() {
  if (editing) placeTextEdit();
  const r = window.devicePixelRatio || 1;
  ctx.setTransform(r, 0, 0, r, 0, 0);
  ctx.clearRect(0, 0, innerWidth, innerHeight);

  /* ---- the ruled paper, so it reads as a place to write ---- */
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, innerWidth, innerHeight);
  ctx.strokeStyle = RULE;
  ctx.lineWidth = 1;
  const GAP = 38;
  for (let y = (pan.y % GAP + GAP) % GAP; y < innerHeight; y += GAP) {
    ctx.beginPath(); ctx.moveTo(0, y + .5); ctx.lineTo(innerWidth, y + .5); ctx.stroke();
  }

  /* ---- everything below moves with the pan and scales with the zoom ---- */
  ctx.save();
  ctx.translate(pan.x, pan.y);
  ctx.scale(zoom, zoom);
  paint(ctx, {shadows: true});
  drawSelection(ctx);
  ctx.restore();
}

/* the loop while you draw it, and a dashed box around what it caught */
function drawSelection(c) {
  c.save();
  c.setLineDash([6 / zoom, 5 / zoom]);
  c.lineWidth = 1.5 / zoom;
  c.strokeStyle = getCSS('--accent');
  if (lasso && lasso.length > 1) {
    c.beginPath(); c.moveTo(lasso[0].x, lasso[0].y);
    for (const q of lasso) c.lineTo(q.x, q.y);
    c.closePath(); c.stroke();
  }
  const b = selectionBox();
  if (b) {
    c.fillStyle = 'rgba(63,93,82,.06)';
    c.fillRect(b.minX - 8, b.minY - 8, b.maxX - b.minX + 16, b.maxY - b.minY + 16);
    c.strokeRect(b.minX - 8, b.minY - 8, b.maxX - b.minX + 16, b.maxY - b.minY + 16);
  }
  c.restore();
}

/* ============================================================
   paint — the page's content, in board coordinates, onto ANY canvas.
   The screen, the snapshot for the model, and the export all call
   this, so what you see is exactly what gets sent and saved.
   ============================================================ */
function paint(c, {shadows = false, ai = true, pdf = true, revealed = true} = {}) {
  /* the paper you brought: PDF pages, drawn first so ink sits on top */
  if (pdf) for (const pg of pages) {
    if (shadows) { c.shadowColor = 'rgba(0,0,0,.12)'; c.shadowBlur = 12; c.shadowOffsetY = 3; }
    c.fillStyle = '#fff'; c.fillRect(pg.x, pg.y, pg.w, pg.h);
    c.shadowColor = 'transparent'; c.shadowBlur = 0; c.shadowOffsetY = 0;
    c.drawImage(pg.img, pg.x, pg.y, pg.w, pg.h);
  }

  c.lineCap = 'round';
  c.lineJoin = 'round';
  for (const s of strokes) drawStroke(c, s);
  if (c === ctx && drawing) drawStroke(c, drawing);

  /* typed text, in the page's own font (the box being edited is drawn by the textarea instead) */
  c.textBaseline = 'top';
  for (const t of texts) {
    if (c === ctx && t === editing) continue;
    c.font = textFont(t.size); c.fillStyle = t.color;
    t.text.split('\n').forEach((ln, i) => c.fillText(ln, t.x, t.y + i * t.size * 1.3));
  }

  if (!ai) return;

  /* the AI's strike-throughs: a line through the wrong bit, left to right */
  c.strokeStyle = AI_INK; c.lineWidth = 3;
  for (const l of aiLines) {
    const f = revealed ? l.shown : 1;
    c.beginPath();
    c.moveTo(l.x1, l.y1);
    c.lineTo(l.x1 + (l.x2 - l.x1) * f, l.y1 + (l.y2 - l.y1) * f);
    c.stroke();
  }

  /* the AI's writing: its own colour, its own layer, only as many
     characters as the animation has revealed, at the student's size */
  c.fillStyle = AI_INK;
  c.textBaseline = 'top';
  for (const m of aiMarks) {
    c.font = aiFont(m.size);
    const lines = (revealed ? m.text.slice(0, m.shown) : m.text).split('\n');
    lines.forEach((ln, i) => c.fillText(ln, m.x, m.y + i * m.size * 1.35));
  }
}

function drawStroke(c, s) {
  c.strokeStyle = s.color;
  c.lineWidth = s.width;
  c.beginPath();
  tracePath(c, s.pts);
  c.stroke();
}

/* ============================================================
   tracePath — the shape of a stroke, shared by the screen and the
   snapshot so they can never disagree. Straight lines between pen
   samples look like a polygon; a curve through each midpoint, bent
   toward the sample, reads as ink. One point = a dot (round caps).
   ============================================================ */
function tracePath(c, pts) {
  if (!pts.length) return;
  c.moveTo(pts[0].x, pts[0].y);
  if (pts.length < 3) { for (const q of pts) c.lineTo(q.x, q.y); return; }
  for (let i = 1; i < pts.length - 1; i++) {
    const mx = (pts[i].x + pts[i + 1].x) / 2, my = (pts[i].y + pts[i + 1].y) / 2;
    c.quadraticCurveTo(pts[i].x, pts[i].y, mx, my);
  }
  const l = pts[pts.length - 1];
  c.lineTo(l.x, l.y);
}

function getCSS(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

/* ============================================================
   INPUT — the rules that make this feel like paper:

     pen or mouse       -> draw
     one finger         -> pan, until a pen has been used; then it is a palm
     two fingers        -> pan and zoom, always
     eraser (toggle, or a pen's eraser end) -> remove whole strokes

   Once a real pen has touched the page, a single finger never pans —
   that's how GoodNotes and Procreate behave, and it is what makes
   resting your hand on the glass safe.
   ============================================================ */
let lastPenAt = 0;       /* when the pen last touched — a palm lands right after */
const PALM_MS = 1500;    /* a finger inside this window of pen contact is a palm */
let penSeen = false;     /* once a real pen has touched, single fingers are palms, full stop */

cv.addEventListener('pointerdown', e => {
  /* capture so the up arrives even if the pen crosses the edge; a pointer that
     is already gone (or a synthetic one) throws here, and that must not kill the stroke */
  try { cv.setPointerCapture(e.pointerId); } catch {}
  if (!WIDE()) setSide(false); exportMenu.classList.remove('open');      /* touching the paper closes menus */

  if (e.pointerType === 'touch') {
    if (drawing || erasing || performance.now() - lastPenAt < PALM_MS) return;   /* a palm */

    touches.set(e.pointerId, {x: e.clientX, y: e.clientY});
    if (penSeen && touches.size === 1) return;                                  /* also a palm */
    if (touches.size === 2) {                /* second finger: a pinch begins */
      const [a, b] = [...touches.values()];
      pinch = {dist: Math.hypot(a.x - b.x, a.y - b.y),
               mid: {x: (a.x + b.x) / 2, y: (a.y + b.y) / 2},
               zoom0: zoom, pan0: {...pan}};
      panFrom = null;
    } else if (touches.size === 1) {         /* one finger, no pen yet: move the paper */
      panFrom = {x: e.clientX - pan.x, y: e.clientY - pan.y};
    }
    return;
  }

  lastPenAt = performance.now();
  if (e.pointerType === 'pen') penSeen = true;
  panFrom = null; pinch = null; touches.clear();   /* pen wins over fingers */

  /* text: tap an existing box to edit it, tap empty paper to start one */
  if (tool === 'text') {
    if (e.pointerType === 'touch') return;
    const p = pt(e);
    const hit = texts.find(t => { const b = textBox(t); return p.x >= b.minX - 4 && p.x <= b.maxX + 4 && p.y >= b.minY - 4 && p.y <= b.maxY + 4; });
    editText(hit || {x: p.x, y: p.y - 9, text: '', size: 18, color: pen, fresh: true});
    return;
  }

  /* select: inside the selected box, a drag MOVES it; anywhere else, a new loop */
  if (tool === 'select') {
    const p = pt(e), b = selectionBox();
    if (b && p.x >= b.minX - 8 && p.x <= b.maxX + 8 && p.y >= b.minY - 8 && p.y <= b.maxY + 8) {
      moving = {last: p, dx: 0, dy: 0};
    } else {
      setSelection(null);
      lasso = [p];
    }
    return;
  }

  /* eraser: the toolbar toggle, OR the eraser end of a pen that has one
     (button 5 / buttons bit 32 — Surface, Wacom). Apple Pencil has neither,
     which is why the toggle exists. */
  if (tool === 'eraser' || e.button === 5 || (e.buttons & 32)) {
    erasing = [];
    eraseAt(pt(e));
    return;
  }

  /* pen pressure gives a live line width; a mouse reports 0, so fall back */
  drawing = {color: pen, width: penWidth(e), pts: [pt(e)]};
});

cv.addEventListener('pointermove', e => {
  if (e.pointerType === 'touch') {
    if (!touches.has(e.pointerId)) return;   /* a palm we chose to ignore */
    touches.set(e.pointerId, {x: e.clientX, y: e.clientY});

    if (pinch && touches.size === 2) {
      /* zoom by how much the fingers spread; keep the board point that
         was under the fingers' midpoint pinned under it as they move */
      const [a, b] = [...touches.values()];
      const dist = Math.hypot(a.x - b.x, a.y - b.y);
      const mid  = {x: (a.x + b.x) / 2, y: (a.y + b.y) / 2};
      zoom = Math.min(6, Math.max(0.25, pinch.zoom0 * dist / pinch.dist));
      const bx = (pinch.mid.x - pinch.pan0.x) / pinch.zoom0;   /* board point under mid0 */
      const by = (pinch.mid.y - pinch.pan0.y) / pinch.zoom0;
      pan = {x: mid.x - bx * zoom, y: mid.y - by * zoom};
      return redraw();
    }
    if (panFrom) {
      pan = {x: e.clientX - panFrom.x, y: e.clientY - panFrom.y};
      return redraw();
    }
    return;
  }

  lastPenAt = performance.now();
  if (moving) {                                     /* drag the selection along */
    const p = pt(e), dx = p.x - moving.last.x, dy = p.y - moving.last.y;
    shiftSelection(dx, dy); moving.dx += dx; moving.dy += dy; moving.last = p;
    return redraw();
  }
  if (lasso) { lasso.push(pt(e)); return redraw(); }
  if (erasing) return eraseAt(pt(e));
  if (!drawing) return;

  /* The Pencil samples far faster than the browser fires events; the
     in-between samples come as "coalesced" events. Use them, or fast
     strokes come out as a few long straight lines. (The list can be
     EMPTY for synthetic or non-pen input — then the event itself is
     the only sample, and must not be dropped.) */
  const coalesced = e.getCoalescedEvents ? e.getCoalescedEvents() : null;
  const events = coalesced && coalesced.length ? coalesced : [e];
  const from = drawing.pts.length;
  for (const ce of events) drawing.pts.push(pt(ce));

  /* Draw only the new bit of THIS stroke, not the whole board again.
     A full redraw per sample is what made ink trail behind the pen. */
  ctx.save();
  ctx.translate(pan.x, pan.y);
  ctx.scale(zoom, zoom);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = drawing.color; ctx.lineWidth = drawing.width;
  ctx.beginPath();
  tracePath(ctx, drawing.pts.slice(Math.max(0, from - 2)));
  ctx.stroke();
  ctx.restore();
});

function done(e) {
  if (e.pointerType === 'touch') {
    touches.delete(e.pointerId);
    if (touches.size < 2) pinch = null;
    if (touches.size === 0) panFrom = null;
    else if (touches.size === 1 && !penSeen) {   /* one finger left: it can keep panning */
      const t = [...touches.values()][0];
      panFrom = {x: t.x - pan.x, y: t.y - pan.y};
    }
    dirty();                                     /* pan/zoom are saved too */
    return;
  }
  if (moving) {                                    /* a move is one undo step */
    if (moving.dx || moving.dy) { record({type: 'move', sel: selection, dx: moving.dx, dy: moving.dy}); dirty(); }
    moving = null;
    return redraw();
  }
  if (lasso) {                                     /* close the loop, see what it caught */
    const loop = lasso; lasso = null;
    setSelection(loop.length > 2 ? pick(loop) : null);
    return redraw();
  }
  if (erasing) {                                   /* one drag = one undo step */
    if (erasing.length) { record({type: 'erase', strokes: erasing}); dirty(); }
    erasing = null;
    return redraw();
  }
  if (drawing) {
    if (drawing.pts.length === 1) drawing.pts.push({...drawing.pts[0]});   /* a tap = a dot */
    strokes.push(drawing);
    record({type: 'add', stroke: drawing});
    lastPenAt = performance.now();
    dirty();
  }
  drawing = null;
  redraw();
}
cv.addEventListener('pointerup', done);
cv.addEventListener('pointercancel', done);
/* NOT pointerleave: with pointer capture the up still arrives, and ending
   a stroke the moment the pen crossed the edge cut words in half. */

/* ============================================================
   eraseAt — a stroke eraser, like OneNote's default: touch any part
   of a stroke and the whole stroke goes. Whole strokes, not pixels,
   because strokes[] is the memory — a pixel eraser would leave the
   picture and the list disagreeing.
   ============================================================ */
const ERASER_R = 12;
function eraseAt(p) {
  let hit = false;
  for (let i = strokes.length - 1; i >= 0; i--) {
    if (strokeNear(strokes[i], p, ERASER_R / zoom)) {
      erasing.push(strokes.splice(i, 1)[0]);
      hit = true;
    }
  }
  if (hit) redraw();
}

/* is point p within r of any segment of stroke s? */
function strokeNear(s, p, r) {
  const pts = s.pts;
  for (let i = 1; i < pts.length; i++) {
    if (segDist(pts[i - 1], pts[i], p) <= r + s.width / 2) return true;
  }
  return false;
}

/* distance from point p to the segment a-b */
function segDist(a, b, p) {
  const dx = b.x - a.x, dy = b.y - a.y;
  const len2 = dx * dx + dy * dy || 1;
  let t = ((p.x - a.x) * dx + (p.y - a.y) * dy) / len2;
  t = Math.max(0, Math.min(1, t));
  const qx = a.x + t * dx, qy = a.y + t * dy;
  return Math.hypot(p.x - qx, p.y - qy);
}

/* ============================================================
   SELECT — circle anything, then move it or delete it.
   A stroke is caught when most of its points are inside the loop; the
   AI's text when the middle of its box is; a strike-through when its
   midpoint is. Moving shifts the caught things' coordinates; deleting
   pulls them out of their lists. Both are one undo step each.
   ============================================================ */
function inside(loop, p) {                     /* ray casting: is p inside the polygon? */
  let hit = false;
  for (let i = 0, j = loop.length - 1; i < loop.length; j = i++) {
    const a = loop[i], b = loop[j];
    if ((a.y > p.y) !== (b.y > p.y) && p.x < (b.x - a.x) * (p.y - a.y) / (b.y - a.y) + a.x) hit = !hit;
  }
  return hit;
}
function markBox(m) {
  ctx.font = aiFont(m.size);
  const lines = m.text.split('\n');
  const w = Math.max(...lines.map(l => ctx.measureText(l).width));
  return {minX: m.x, minY: m.y, maxX: m.x + w, maxY: m.y + lines.length * m.size * 1.35};
}
function pick(loop) {
  const sel = {
    texts: texts.filter(t => { const b = textBox(t); return inside(loop, {x: (b.minX + b.maxX) / 2, y: (b.minY + b.maxY) / 2}); }),
    strokes: strokes.filter(s => s.pts.filter(q => inside(loop, q)).length * 2 >= s.pts.length),
    marks: aiMarks.filter(m => { const b = markBox(m); return inside(loop, {x: (b.minX + b.maxX) / 2, y: (b.minY + b.maxY) / 2}); }),
    lines: aiLines.filter(l => inside(loop, {x: (l.x1 + l.x2) / 2, y: (l.y1 + l.y2) / 2})),
  };
  return (sel.strokes.length + sel.marks.length + sel.lines.length + sel.texts.length) ? sel : null;
}
function selectionBox() {
  if (!selection) return null;
  let b = null;
  for (const s of selection.strokes) for (const q of s.pts) b = union(b, {minX: q.x, minY: q.y, maxX: q.x, maxY: q.y});
  for (const m of selection.marks) b = union(b, markBox(m));
  for (const t of selection.texts || []) b = union(b, textBox(t));
  for (const l of selection.lines) b = union(b, {minX: Math.min(l.x1, l.x2), minY: Math.min(l.y1, l.y2), maxX: Math.max(l.x1, l.x2), maxY: Math.max(l.y1, l.y2)});
  return b;
}
function shiftSelection(dx, dy, sel = selection) {
  if (!sel) return;
  for (const s of sel.strokes) for (const q of s.pts) { q.x += dx; q.y += dy; }
  for (const m of sel.marks) { m.x += dx; m.y += dy; }
  for (const t of sel.texts || []) { t.x += dx; t.y += dy; }
  for (const l of sel.lines) { l.x1 += dx; l.x2 += dx; l.y1 += dy; l.y2 += dy; }
}
const selBar = document.getElementById('selBar');
function setSelection(sel) {
  selection = sel;
  selBar.classList.toggle('on', !!sel);
  if (sel) {
    const n = sel.strokes.length + sel.marks.length + sel.lines.length + (sel.texts || []).length;
    document.getElementById('selCount').textContent = n + (n === 1 ? ' thing' : ' things') + ' selected';
  }
  redraw();
}
function deleteSelection() {
  if (!selection) return;
  const sel = selection;
  for (const s of sel.strokes) { const i = strokes.indexOf(s); if (i >= 0) strokes.splice(i, 1); }
  for (const m of sel.marks)   { const i = aiMarks.indexOf(m); if (i >= 0) aiMarks.splice(i, 1); }
  for (const l of sel.lines)   { const i = aiLines.indexOf(l); if (i >= 0) aiLines.splice(i, 1); }
  for (const t of sel.texts || []) { const i = texts.indexOf(t); if (i >= 0) texts.splice(i, 1); }
  record({type: 'delete', sel});
  setSelection(null); dirty();
}
document.getElementById('selDelete').onclick = deleteSelection;
document.getElementById('selDone').onclick = () => setSelection(null);
addEventListener('keydown', e => {
  if ((e.key === 'Delete' || e.key === 'Backspace') && selection && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) {
    e.preventDefault(); deleteSelection();
  }
});

/* a mouse can't pan by dragging (dragging draws), so the wheel / trackpad
   does. A trackpad pinch arrives as a wheel with ctrlKey — that zooms. */
cv.addEventListener('wheel', e => {
  e.preventDefault();
  if (e.ctrlKey || e.metaKey) {
    const factor = Math.exp(-e.deltaY * 0.01);
    zoomAt(e.clientX, e.clientY, Math.min(6, Math.max(0.25, zoom * factor)));
  } else {
    pan = {x: pan.x - e.deltaX, y: pan.y - e.deltaY};
  }
  redraw();
  dirty();
}, {passive: false});

/* change zoom while keeping the board point under (sx, sy) where it is */
function zoomAt(sx, sy, z) {
  const bx = (sx - pan.x) / zoom, by = (sy - pan.y) / zoom;
  zoom = z;
  pan = {x: sx - bx * zoom, y: sy - by * zoom};
}

/* the point, in board space — pan and zoom undone, so ink lands where the pen is */
const pt = e => ({x: (e.clientX - pan.x) / zoom, y: (e.clientY - pan.y) / zoom});
const penWidth = e => ((e.pressure > 0 && e.pointerType === 'pen')
  ? 1.2 + e.pressure * 3.4 : 2.4) * thickness;

/* pen thickness cycles fine -> medium -> bold, like OneNote's pen sizes */
const THICK = [{k: .7, name: 'Fine'}, {k: 1, name: 'Medium'}, {k: 1.6, name: 'Bold'}];
let thickI = 1;
const thickBtn = document.getElementById('thick');
thickBtn.onclick = () => {
  thickI = (thickI + 1) % THICK.length;
  thickness = THICK[thickI].k;
  document.getElementById('thickLabel').textContent = THICK[thickI].name;
  thickBtn.title = 'Pen thickness: ' + THICK[thickI].name.toLowerCase();
  setTool('pen');
};

/* the ribbon's tabs — remembered per device */

function showTab(name) {

/* ============================================================
   TEXT — type anywhere on the page, the way OneNote does.
   A tap with the Text tool opens a box at that spot (or re-opens an
   existing one). What you type lives in texts[] in board coordinates
   and is drawn on the canvas like everything else — so it's in the
   snapshot the tutor sees, in exports, and the lasso can move it.
   ============================================================ */
const textFont = size => `${size}px ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif`;
const textEdit = document.getElementById('textEdit');
let editing = null;

function textBox(t) {
  ctx.font = textFont(t.size);
  const lines = t.text.split('\n');
  const w = Math.max(60, ...lines.map(l => ctx.measureText(l).width));
  return {minX: t.x, minY: t.y, maxX: t.x + w, maxY: t.y + lines.length * t.size * 1.3};
}
function editText(t) {
  if (editing) commitText();
  editing = t;
  if (!texts.includes(t)) texts.push(t);
  t._before = t.fresh ? null : {x: t.x, y: t.y, text: t.text, size: t.size, color: t.color};
  textEdit.value = t.text;
  placeTextEdit();
  textEdit.style.display = 'block';
  redraw();
  setTimeout(() => { textEdit.focus(); textEdit.setSelectionRange(textEdit.value.length, textEdit.value.length); }, 0);
}
function placeTextEdit() {
  if (!editing) return;
  textEdit.style.left = (editing.x * zoom + pan.x - 5) + 'px';
  textEdit.style.top = (editing.y * zoom + pan.y - 3) + 'px';
  textEdit.style.fontSize = (editing.size * zoom) + 'px';
  textEdit.style.color = editing.color;
  textEdit.style.height = 'auto';
  textEdit.style.height = textEdit.scrollHeight + 'px';
  ctx.font = textFont(editing.size);
  const w = Math.max(120, ...textEdit.value.split('\n').map(l => ctx.measureText(l).width * zoom + 24));
  textEdit.style.width = w + 'px';
}
textEdit.addEventListener('input', () => { if (editing) { editing.text = textEdit.value; placeTextEdit(); } });
textEdit.addEventListener('keydown', e => { if (e.key === 'Escape') { e.preventDefault(); commitText(); } });
textEdit.addEventListener('blur', () => commitText());
function commitText() {
  const t = editing; if (!t) return;
  editing = null;
  textEdit.style.display = 'none';
  t.text = textEdit.value.replace(/\s+$/, '');
  const before = t._before, fresh = t.fresh; delete t._before; delete t.fresh;
  if (!t.text.trim()) {                          /* emptied: the box goes away */
    const i = texts.indexOf(t); if (i >= 0) texts.splice(i, 1);
    if (!fresh) record({type: 'text', item: t, before, after: null});
  } else {
    const after = {x: t.x, y: t.y, text: t.text, size: t.size, color: t.color};
    if (fresh || JSON.stringify(before) !== JSON.stringify(after)) record({type: 'text', item: t, before, after});
  }
  redraw(); dirty();
}
document.getElementById('textBtn').onclick = () => setTool(tool === 'text' ? 'pen' : 'text');

PENS.forEach((c, i) => {

selectBtn.onclick = () => setTool(tool === 'select' ? 'pen' : 'select');

/* undo reverses the LAST ACTION — a drawn stroke, or everything one
   eraser drag removed — so erasing is never a one-way door */
document.getElementById('undo').onclick = () => {
  const last = history.pop();
  if (!last) return;
  apply(last, -1);
  redoStack.push(last);
  setSelection(null); redraw(); dirty();
};
document.getElementById('redo').onclick = () => {
  const next = redoStack.pop();
  if (!next) return;
  apply(next, +1);
  history.push(next);
  setSelection(null); redraw(); dirty();
};
/* apply an action forwards (+1, redo) or backwards (-1, undo) */
function apply(a, dir) {
  const remove = (list, items) => { for (const it of items) { const i = list.indexOf(it); if (i >= 0) list.splice(i, 1); } };
  if (a.type === 'add')    { dir > 0 ? strokes.push(a.stroke) : remove(strokes, [a.stroke]); }
  if (a.type === 'erase')  { dir > 0 ? remove(strokes, a.strokes) : strokes.push(...a.strokes); }
  if (a.type === 'delete') {
    const tx = a.sel.texts || [];
    if (dir > 0) { remove(strokes, a.sel.strokes); remove(aiMarks, a.sel.marks); remove(aiLines, a.sel.lines); remove(texts, tx); }
    else { strokes.push(...a.sel.strokes); aiMarks.push(...a.sel.marks); aiLines.push(...a.sel.lines); texts.push(...tx); }
  }
  if (a.type === 'text') {                       /* a typed box appeared, changed, or was emptied */
    const want = dir > 0 ? a.after : a.before;
    if (want === null) remove(texts, [a.item]);
    else { if (!texts.includes(a.item)) texts.push(a.item); Object.assign(a.item, want); }
  }
  if (a.type === 'move')   { shiftSelection(dir * a.dx, dir * a.dy, a.sel); }
}
document.getElementById('clear').onclick = () => {
  if (editing) commitText();
  strokes.length = 0; texts.length = 0; aiMarks.length = 0; aiLines.length = 0; history.length = 0; redoStack.length = 0;
  setSelection(null); say(''); showRead.hidden = true;
  dirty();
};

/* ============================================================
   SNAPSHOT — a clean picture of the work for the model.
   Deliberately NOT the visible canvas: the ruled lines and the AI's
   own marks would end up in the image and be read as the student's
   work. White paper, the student's ink, and — if the ink is on a PDF
   page — that page, because the printed problem is context the model
   badly needs. Pages the ink never touched stay out.
   ============================================================ */
function snapshot({withAI = false} = {}) {
  let box = bounds();
  if (!box) return null;
  if (withAI) for (const m of aiMarks) box = union(box, markBox(m));

  const onPages = pages.filter(pg => pg.x < box.maxX && pg.x + pg.w > box.minX &&
                                     pg.y < box.maxY && pg.y + pg.h > box.minY);
  for (const pg of onPages) box = union(box, {minX: pg.x, minY: pg.y, maxX: pg.x + pg.w, maxY: pg.y + pg.h});

  const PAD = 40, SCALE = onPages.length ? 1.3 : 2;   /* a page is already big; ink alone gets 2x */
  const w = box.maxX - box.minX + PAD * 2;
  const h = box.maxY - box.minY + PAD * 2;

  const off = document.createElement('canvas');
  off.width = w * SCALE; off.height = h * SCALE;
  const o = off.getContext('2d');
  o.fillStyle = '#ffffff';
  o.fillRect(0, 0, off.width, off.height);
  o.scale(SCALE, SCALE);
  o.translate(PAD - box.minX, PAD - box.minY);
  const keep = pages.splice(0, pages.length, ...onPages);     /* paint only the pages the ink is on */
  paint(o, {ai: withAI, revealed: false});
  pages.splice(0, pages.length, ...keep);
  /* JPEG, not PNG: a fifth of the bytes to upload, and black ink on white
     paper survives compression fine. That upload was most of the wait. */
  return {url: off.toDataURL('image/jpeg', 0.85), box, PAD, SCALE, w: off.width, h: off.height};
}

function bounds() {
  let b = null;
  for (const s of strokes) for (const p of s.pts) b = union(b, {minX: p.x, minY: p.y, maxX: p.x, maxY: p.y});
  for (const t of texts) if (t.text.trim()) b = union(b, textBox(t));
  return b;
}
const union = (a, b) => !a ? b : !b ? a : {minX: Math.min(a.minX, b.minX), minY: Math.min(a.minY, b.minY),
                                           maxX: Math.max(a.maxX, b.maxX), maxY: Math.max(a.maxY, b.maxY)};

/* ============================================================
   CHECK MY WORK — read -> (ask only if unsure) -> first mistake
   ============================================================ */
const panel   = document.getElementById('panel');
const readEl  = document.getElementById('read');
const checkEl = document.getElementById('check');
const showRead = document.getElementById('showRead');
const panelTitle = document.getElementById('panelTitle');
const panelWhy = document.getElementById('panelWhy');
const topicEl = document.getElementById('topic');
const titleEl = document.getElementById('title');
const topic = () => topicEl.value.trim();
let shot = null;                       /* the picture both calls share */

topicEl.addEventListener('input', dirty);
titleEl.addEventListener('input', () => { if (current) { current.title = titleEl.value; renderSide(); } dirty(); });

const examOpen = () => !!(current && current.exam && !current.exam.graded);   /* an exam not yet graded */

checkEl.onclick = async () => {
  shot = snapshot({withAI: examOpen()});             /* the grader must see the printed problems */
  if (!shot) return say('Write something first.', true);
  if (examOpen() && current.exam.locked) { current.exam.locked = false; applyExamState(); dirty(); }

  busy(true, 'Reading your work…');
  try {
    const r = await api('/transcribe', {image: shot.url, context: topic()});
    readEl.value = r.transcription;
    showRead.hidden = false;

    /* The model marks anything it wasn't sure of in [brackets]. None?
       Don't stop to ask — straight to the check. Some? Ask ONLY about
       those. The reading stays one tap away either way. */
    const doubts = (r.transcription.match(/\[[^\]]*\]/g) || []).length;
    if (doubts === 0) return runCheck();

    panelTitle.textContent = doubts === 1 ? "One spot I wasn't sure about" : `${doubts} spots I wasn't sure about`;
    panelWhy.textContent = "My other guess is in [brackets]. Keep the right one, then check.";
    panel.classList.add('on');
    readEl.focus();
  } catch (e) { say(e.message, true); }
  busy(false);
};

showRead.onclick = () => {
  panelTitle.textContent = "Here's what I read";
  panelWhy.textContent = "Fix anything I got wrong, then check again.";
  panel.classList.add('on');
};
document.getElementById('cancel').onclick = () => panel.classList.remove('on');
document.getElementById('confirm').onclick = () => runCheck();

async function runCheck() {
  panel.classList.remove('on');
  if (examOpen()) return runGrade();
  busy(true, 'Looking for the first thing to fix…');
  try {
    const v = await api('/check', {image: shot.url, work: readEl.value, context: topic()});
    if (v.all_correct) {
      write("Nothing wrong here.\nThis is all correct.");
    } else {
      /* cross out the wrong bit where it sits, then write the way through
         underneath: what's wrong, the steps, and the line done right */
      if (Array.isArray(v.wrong_box) && v.wrong_box.length === 4) strike(v.wrong_box);
      const steps = Array.isArray(v.steps) ? v.steps.filter(Boolean).slice(0, 3) : [];
      write([v.problem, "Here's how we do it:", ...steps,
             v.corrected_line ? `So: ${v.corrected_line}` : ''].filter(Boolean).join('\n'));
    }
    say(v.all_correct ? 'All correct.' : (v.checks_left != null ? `${v.checks_left} checks left` : ''));
  } catch (e) { say(e.message, true); }
  busy(false);
}

/* the whole exam at once: strike-throughs where it went wrong, then the
   score and one note per problem, under the work. Unlocks the tutor. */
async function runGrade() {
  busy(true, 'Grading…');
  try {
    const v = await api('/check', {image: shot.url, work: readEl.value, context: topic(), mode: 'grade', n: current.exam.n});
    const results = Array.isArray(v.results) ? v.results : [];
    for (const r of results) if (!r.correct && Array.isArray(r.wrong_box) && r.wrong_box.length === 4) strike(r.wrong_box);
    const right = results.filter(r => r.correct).length;
    const lines = [`Score: ${v.score || (right + '/' + (results.length || current.exam.n))}`];
    for (const r of results) {
      lines.push(`${r.n}. ${r.correct ? '✓' : '✗'} ${(r.note || '').trim()}` +
                 (!r.correct && r.corrected_line ? `  →  ${r.corrected_line}` : ''));
    }
    write(lines.join('\n'));
    current.exam.graded = true; applyExamState(); dirty();
    say(`Graded ${lines[0].toLowerCase()}. The tutor is unlocked — ask about anything you missed.`);
  } catch (e) { say(e.message, true); }
  busy(false);
}

/* exam pages lock the tutor until "I'm done" */
function applyExamState() {
  const locked = examOpen() && current.exam.locked;
  chatBtn.disabled = locked;
  chatBtn.title = locked ? 'Locked until you finish the exam' : 'Talk to the tutor';
  if (locked) { chatEl.classList.remove('open'); chatBtn.setAttribute('aria-pressed', false); }
  checkEl.textContent = locked ? "I'm done — grade it" : 'Check my work';
}

async function post(path, body) {
  const res = await fetch(path, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({message: 'no answer from server'}));
  if (!res.ok) throw new Error(data.message || 'something went wrong');
  return data;
}

/* ============================================================
   BRING YOUR OWN KEY — anyone's free Gemini quota, not ours.

   Google won't let a person's sign-in pay for Gemini calls (quota is a
   Cloud project's, not a login's). The honest version is this: paste
   your own free key, and the page calls Gemini DIRECTLY from the
   browser with it. The key never touches Showwork's server. Without a
   key, calls go to our server, on our quota, exactly as before.
   api() is the fork; everything above it can't tell the difference.
   ============================================================ */
const G_MODEL = 'gemini-3.5-flash-lite';
let PROMPTS = null;                                  /* same prompts.json the servers use */
const userKey = () => { try { return localStorage.getItem('showwork.key') || ''; } catch { return ''; } };

async function loadPrompts() {
  try { PROMPTS = await (await fetch('/prompts.json')).json(); } catch { PROMPTS = null; }
}

async function api(path, body) {
  const key = userKey();
  if (!key || !PROMPTS) return post(path, body);    /* no key: our server, as before */

  const ctx  = (body.context || '').trim().slice(0, 300);
  const note = ctx ? PROMPTS.context_note.replace('{context}', ctx) : '';

  if (path === '/transcribe') {
    const text = await gemini(key, {contents: [{parts: [{text: note + PROMPTS.transcribe}, imgPart(body.image)]}]});
    return {transcription: text.trim(), checks_left: null};
  }
  if (path === '/check') {
    const prompt = body.mode === 'grade'
      ? PROMPTS.grade.replace('{work}', body.work).replace(/\{n\}/g, String(body.n || 5))
      : PROMPTS.check.replace('{work}', body.work);
    const raw = await gemini(key, {contents: [{parts: [{text: note + prompt}, imgPart(body.image)]}]});
    let v; try { v = JSON.parse(stripFence(raw)); } catch { v = {line: '', problem: raw.trim(), nudge: '', all_correct: false}; }
    v.checks_left = null;
    return v;
  }
  /* /chat: alternating turns, the page's picture on the last one */
  const msgs = body.messages;
  const contents = msgs.slice(0, -1).map(m => ({role: m.role === 'model' ? 'model' : 'user', parts: [{text: m.text}]}));
  const last = msgs[msgs.length - 1], parts = [{text: last.text}];
  if (body.image) parts.push(imgPart(body.image));
  contents.push({role: 'user', parts});
  const raw = await gemini(key, {system_instruction: {parts: [{text: note + PROMPTS.chat}]}, contents});
  let say = raw.trim(), board = '';
  try { const o = JSON.parse(stripFence(raw)); say = String(o.say || ''); board = String(o.board || ''); } catch {}
  return {say, board, checks_left: null};
}

/* the one place the browser talks to Gemini */
async function gemini(key, reqBody) {
  const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${G_MODEL}:generateContent`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json', 'x-goog-api-key': key},
    body: JSON.stringify(reqBody),
  });
  if (!res.ok) {
    const t = await res.text().catch(() => '');
    if (res.status === 429) throw new Error('Your Gemini key is out of quota for now.');
    if (res.status === 400 || res.status === 403) throw new Error('Google rejected that Gemini key — check it in ⚙.');
    throw new Error(`Gemini ${res.status}: ${t.slice(0, 120)}`);
  }
  const j = await res.json();
  return j.candidates[0].content.parts[0].text;
}
const imgPart = url => {
  const [head, b64] = url.split(',', 2);
  return {inline_data: {mime_type: head.slice(5).split(';')[0] || 'image/png', data: b64}};
};
function stripFence(text) {                          /* the model likes ```json fences */
  let t = text.trim();
  if (t.startsWith('```')) { t = t.includes('\n') ? t.slice(t.indexOf('\n') + 1) : t; t = t.slice(0, t.lastIndexOf('```')); }
  return t.trim();
}
