name = "showwork"
main = "worker.js"
compatibility_date = "2026-09-01"

# learn.avery-keller.net is the name now (2026-09-21); the old showwork.avery-keller.net keeps answering
# until Avery says drop it. Cloudflare creates the DNS records for custom domains. The Worker itself
# stays named "showwork" — its secrets (GEMINI_API_KEY) and D1 binding live on that name.
routes = [
  { pattern = "learn.avery-keller.net",    custom_domain = true },
  { pattern = "showwork.avery-keller.net", custom_domain = true },
]

# index.html is imported as a string in worker.js — one copy of the board, no assets folder.
[[rules]]
type = "Text"
globs = ["**/*.html", "**/*.webmanifest", "**/sw.js"]
fallthrough = true

[[rules]]
type = "Data"
globs = ["**/*.png"]
fallthrough = false

# The key is NOT here. It is a secret:  wrangler secret put GEMINI_API_KEY

# The shared key's daily allowance, counted per visitor. Students who bring
# their own Gemini key never reach the Worker at all, so they are never capped.
[[d1_databases]]
binding = "DB"
database_name = "showwork"
database_id = "6a612c6c-83b7-4b23-9148-c0724a14d38d"
